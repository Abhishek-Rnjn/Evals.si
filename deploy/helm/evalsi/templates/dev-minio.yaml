{{- if .Values.devMinio.enabled }}
{{- $fn := include "evalsi.fullname" $ -}}
{{- $old := lookup "v1" "Secret" .Release.Namespace (printf "%s-dev-minio" $fn) }}
{{- $secretKey := randAlphaNum 32 }}
{{- if $old }}{{ $secretKey = index $old.data "secret_key" | b64dec }}{{ end }}
# Not for production: one node, no backups. S3-compatible storage for the
# datasets and payloads, for trials of a cluster install without a cloud's.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fn }}-dev-minio
  labels: {{- include "evalsi.labels" . | nindent 4 }}
stringData:
  access_key: evalsi
  secret_key: {{ $secretKey | quote }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fn }}-dev-minio
  labels: {{- include "evalsi.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $fn }}-dev-minio
spec:
  serviceName: {{ $fn }}-dev-minio
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $fn }}-dev-minio}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $fn }}-dev-minio, app.kubernetes.io/part-of: evalsi}
    spec:
      securityContext: {runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      {{- with .Values.devMinio.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.devMinio.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: minio
          image: {{ include "evalsi.ref" (dict "root" . "ref" .Values.devMinio.image) }}
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: {{ $fn }}-dev-minio, key: access_key}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $fn }}-dev-minio, key: secret_key}}
            - {name: MINIO_DEFAULT_BUCKETS, value: {{ default "evalsi" .Values.storage.s3.bucket | quote }}}
          ports: [{name: s3, containerPort: 9000}]
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: s3}
            periodSeconds: 3
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /bitnami/minio/data}
            - {name: tmp, mountPath: /tmp}
            # The image's runtime directories are root:root 0775, writable
            # by its default group 0 but not by the group this pod runs as:
            # the PID file, logs, and mc's config (bucket creation).
            - {name: runtime, mountPath: /opt/bitnami/minio/tmp, subPath: tmp}
            - {name: runtime, mountPath: /opt/bitnami/minio/log, subPath: log}
            - {name: runtime, mountPath: /.mc, subPath: mc}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: runtime
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.devMinio.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.devMinio.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-dev-minio
  labels: {{- include "evalsi.labels" . | nindent 4 }}
    {{- with .Values.devMinio.serviceLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector: {app.kubernetes.io/name: {{ $fn }}-dev-minio}
  ports: [{name: s3, port: 9000, targetPort: s3}]
{{- end }}
