{{- $fn := include "evalsi.fullname" $ -}}
{{- $v := .Values }}
{{- $natsMonitor := default (printf "%s-nats.%s.svc:8222" $fn .Release.Namespace) $v.keda.natsServerMonitoringEndpoint }}
{{- if and $v.keda.enabled $v.nats.url }}
{{- $natsMonitor = required "keda.natsServerMonitoringEndpoint is required with external NATS" $v.keda.natsServerMonitoringEndpoint }}
{{- end }}
{{- $st := include "evalsi.storage" . | fromJson }}
{{- $sandboxAddress := include "evalsi.sandboxAddress" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fn }}-worker
  labels: {{- include "evalsi.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- range $pool, $p := $v.workers.pools }}
{{- /* A pool's own minReplicas wins even at 0 (default would treat 0 as unset). */}}
{{- $minReplicas := ternary $p.minReplicas $v.keda.minReplicas (hasKey $p "minReplicas") }}
{{- $floor := ternary $minReplicas $p.replicas $v.keda.enabled }}
{{- if and (eq $pool "cpu") (eq (int $floor) 0) }}
{{- fail "workers.pools.cpu must keep at least one worker (replicas, or keda.minReplicas / its minReplicas): the API describes evaluators through a CPU worker, so with none running its restarts wait" }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-worker-{{ $pool }}
  labels: {{- include "evalsi.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $fn }}-worker
    evals.si/pool: {{ $pool }}
spec:
  {{- if not $v.keda.enabled }}
  replicas: {{ $p.replicas }}
  {{- end }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $fn }}-worker, evals.si/pool: {{ $pool }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $fn }}-worker, app.kubernetes.io/part-of: evalsi, evals.si/pool: {{ $pool }}}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") $ | sha256sum }}
    spec:
      serviceAccountName: {{ $fn }}-worker
      securityContext: {{- include "evalsi.podSecurity" $ | nindent 8 }}
      {{- include "evalsi.pluginInit" $ | nindent 6 }}
      {{- with $v.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq $pool "harness" }}
      # Agent trials run long; let them finish (or be redelivered) on shutdown.
      terminationGracePeriodSeconds: 600
      {{- end }}
      containers:
        - name: worker
          {{- if $p.image }}
          image: {{ include "evalsi.ref" (dict "root" $ "ref" $p.image) }}
          {{- else }}
          image: {{ include "evalsi.image" $ }}
          {{- end }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          args: [worker, --config, /etc/evalsi/evalsi.yaml, --pools, {{ $pool }}, --concurrency, {{ $p.concurrency | quote }}]
          env:
            {{- with (default dict $v.plugins).pythonPath }}
            - {name: PYTHONPATH, value: {{ . | quote }}}
            {{- end }}
            {{- if $st.s3.credentialsSecret }}
            - name: EVALSI_S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: {{ $st.s3.credentialsSecret }}, key: access_key}}
            - name: EVALSI_S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ $st.s3.credentialsSecret }}, key: secret_key}}
            {{- end }}
            {{- include "evalsi.natsTokenEnv" $ | nindent 12 }}
            {{- with $v.workers.env }}{{ toYaml . | nindent 12 }}{{ end }}
          {{- with $v.workers.envFrom }}
          envFrom: {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext: {{- include "evalsi.restricted" $ | nindent 12 }}
          resources: {{- toYaml ($p.resources | default dict) | nindent 12 }}
          volumeMounts:
            {{- include "evalsi.pluginMounts" $ | nindent 12 }}
            - {name: config, mountPath: /etc/evalsi, readOnly: true}
            {{- if $sandboxAddress }}
            - {name: worker-tls, mountPath: /etc/evalsi/worker-tls, readOnly: true}
            {{- end }}
            - {name: home, mountPath: /var/lib/evalsi}
            - {name: tmp, mountPath: /tmp}
      volumes:
        {{- with (default dict $v.plugins).volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: config
          configMap: {name: {{ $fn }}-worker}
        {{- if $sandboxAddress }}
        - name: worker-tls
          secret: {secretName: {{ $fn }}-worker-tls}
        {{- end }}
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with ($p.nodeSelector | default $v.workers.nodeSelector) }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with ($p.tolerations | default $v.workers.tolerations) }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if $v.keda.enabled }}
---
# Scales the pool on its JetStream consumer's backlog.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $fn }}-worker-{{ $pool }}
  labels: {{- include "evalsi.labels" $ | nindent 4 }}
spec:
  scaleTargetRef: {name: {{ $fn }}-worker-{{ $pool }}}
  minReplicaCount: {{ $minReplicas }}
  maxReplicaCount: {{ $p.maxReplicas | default $v.keda.maxReplicas }}
  pollingInterval: {{ $v.keda.pollingInterval }}
  triggers:
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: {{ $natsMonitor | quote }}
        account: "$G"
        stream: EVALSI_WORK
        consumer: pool-{{ $pool }}
        lagThreshold: {{ $v.keda.lagThreshold | quote }}
        activationLagThreshold: "0"
{{- end }}
{{- end }}
