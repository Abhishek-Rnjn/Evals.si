{{- if .Values.sandbox.podRung.enabled }}
{{- $fn := include "evalsi.fullname" $ -}}
{{- $ns := .Release.Namespace }}
# Sandbox pools that use the pod rung run as this account: they create one
# pod per sandbox here, and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fn }}-sandboxd
  labels: {{- include "evalsi.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fn }}-sandboxd
  labels: {{- include "evalsi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fn }}-sandboxd
  labels: {{- include "evalsi.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $fn }}-sandboxd}
subjects:
  - {kind: ServiceAccount, name: {{ $fn }}-sandboxd, namespace: {{ $ns }}}
{{- if .Values.sandbox.podRung.networkPolicy }}
---
# Sandbox pods talk to their pool and nothing else: the pool reaches their
# agent, and their only way out is the pool's logging egress proxy.
#
# Policies add up, so a policy that names every evalsi-sandboxd would let one
# release's pool reach another's pods. Pods of a pool this chart runs carry
# evals.si/sandbox-pool and are covered by their own release's policy below.
# This one covers the rest (the pods of SandboxClass pools, which are shared).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-sandbox-pods
  labels: {{- include "evalsi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - {key: evals.si/sandbox, operator: In, values: ["true"]}
      - {key: evals.si/sandbox-pool, operator: DoesNotExist}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: evalsi-sandboxd}}
      ports: [{port: 7070, protocol: TCP}]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: evalsi-sandboxd}}
{{- if and .Values.sandbox.pool.enabled (has "pod" .Values.sandbox.pool.ladder) }}
---
# This release's own pool, and only it, for the pods that pool creates.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-sandbox-pool-pods
  labels: {{- include "evalsi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {evals.si/sandbox: "true", evals.si/sandbox-pool: {{ $fn }}-sandbox-pool}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: evalsi-sandboxd, app.kubernetes.io/instance: {{ $fn }}-sandbox-pool}}
      ports: [{port: 7070, protocol: TCP}]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: evalsi-sandboxd, app.kubernetes.io/instance: {{ $fn }}-sandbox-pool}}
{{- end }}
{{- end }}
{{- end }}
