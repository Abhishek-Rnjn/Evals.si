{{- if .Values.devPostgres.enabled }}
{{- $fn := include "evalsi.fullname" $ -}}
{{- $old := lookup "v1" "Secret" .Release.Namespace (printf "%s-dev-postgres" $fn) }}
{{- $password := randAlphaNum 24 }}
{{- if $old }}{{ $password = index $old.data "password" | b64dec }}{{ end }}
# Not for production: one node, no backups.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fn }}-dev-postgres
  labels: {{- include "evalsi.labels" . | nindent 4 }}
stringData:
  password: {{ $password | quote }}
  dsn: {{ printf "postgres://evalsi:%s@%s-dev-postgres.%s.svc:5432/evalsi?sslmode=disable" $password $fn .Release.Namespace | quote }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fn }}-dev-postgres
  labels: {{- include "evalsi.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $fn }}-dev-postgres
spec:
  serviceName: {{ $fn }}-dev-postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $fn }}-dev-postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $fn }}-dev-postgres, app.kubernetes.io/part-of: evalsi}
    spec:
      securityContext: {runAsUser: 999, runAsGroup: 999, fsGroup: 999, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      {{- with .Values.devPostgres.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.devPostgres.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ include "evalsi.ref" (dict "root" . "ref" .Values.devPostgres.image) }}
          env:
            - {name: POSTGRES_USER, value: evalsi}
            - {name: POSTGRES_DB, value: evalsi}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $fn }}-dev-postgres, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{name: postgres, containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, evalsi]}
            periodSeconds: 3
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.devPostgres.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-dev-postgres
  labels: {{- include "evalsi.labels" . | nindent 4 }}
    {{- with .Values.devPostgres.serviceLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector: {app.kubernetes.io/name: {{ $fn }}-dev-postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
{{- end }}
