{{- if .Values.operator.enabled }}
{{- $v := .Values }}
{{- $ns := .Release.Namespace }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evalsi-operator
  labels: {{- include "evalsi.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: evalsi-operator
  labels: {{- include "evalsi.labels" . | nindent 4 }}
rules:
  - apiGroups: [evals.si]
    resources: [evalruns, onlineevalpolicies, evaluators]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [evals.si]
    resources: [evalruns/status, evalruns/finalizers, onlineevalpolicies/status, onlineevalpolicies/finalizers, evaluators/status]
    verbs: [get, update, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [configmaps, services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [keda.sh]
    resources: [scaledobjects]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: evalsi-operator
  labels: {{- include "evalsi.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: evalsi-operator}
subjects:
  - {kind: ServiceAccount, name: evalsi-operator, namespace: {{ $ns }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evalsi-operator
  labels: {{- include "evalsi.labels" . | nindent 4 }}
    app.kubernetes.io/name: evalsi-operator
spec:
  replicas: {{ $v.operator.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: evalsi-operator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: evalsi-operator, app.kubernetes.io/part-of: evalsi}
    spec:
      serviceAccountName: evalsi-operator
      securityContext: {{- include "evalsi.podSecurity" . | nindent 8 }}
      {{- with .Values.operator.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          image: {{ include "evalsi.image" . }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          command: [evalsi-operator]
          args:
            - --evalsid-url={{ include "evalsi.serverURL" . }}
            {{- if $v.server.tls }}
            - --ca-file=/etc/evalsi/server-tls/ca.crt
            {{- end }}
            # Its own service-account token, projected for evalsid.
            - --token-file=/var/run/secrets/evals.si/token
            - --namespace={{ $ns }}
            {{- if not $v.operator.allNamespaces }}
            - --watch-namespace={{ $ns }}
            {{- end }}
            - --controllers=evalrun,onlineevalpolicy,evaluator{{ if $v.operator.sandboxClasses }},sandboxclass{{ end }}
            - --image={{ include "evalsi.image" . }}
            - --sandbox-tls-secret=evalsi-sandbox-tls
            - --sandbox-allow-client=evalsi-worker
            - --sandbox-service-account=evalsi-sandboxd
            - --worker-config-map=evalsi-worker
            - --nats-monitoring-endpoint=evalsi-nats.{{ $ns }}.svc:8222
            - --create-projects={{ $v.operator.createProjects }}
            - --webhooks={{ $v.operator.webhooks }}
            - --webhook-cert-dir=/etc/evalsi/webhook-tls
            - --leader-elect={{ gt (int $v.operator.replicas) 1 }}
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          ports:
            - {name: webhook, containerPort: 9443}
            - {name: metrics, containerPort: 8080}
            - {name: health, containerPort: 8081}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 20
          securityContext: {{- include "evalsi.restricted" . | nindent 12 }}
          resources: {{- toYaml $v.operator.resources | nindent 12 }}
          volumeMounts:
            - {name: token, mountPath: /var/run/secrets/evals.si, readOnly: true}
            {{- if $v.server.tls }}
            - {name: server-tls, mountPath: /etc/evalsi/server-tls, readOnly: true}
            {{- end }}
            {{- if $v.operator.webhooks }}
            - {name: webhook-tls, mountPath: /etc/evalsi/webhook-tls, readOnly: true}
            {{- end }}
      volumes:
        - name: token
          projected:
            sources:
              - serviceAccountToken: {audience: {{ $v.auth.kubernetes.audience }}, expirationSeconds: 3600, path: token}
        {{- if $v.server.tls }}
        - name: server-tls
          secret: {secretName: evalsi-server-tls, items: [{key: ca.crt, path: ca.crt}]}
        {{- end }}
        {{- if $v.operator.webhooks }}
        - name: webhook-tls
          # Issued by the evalsi-crds chart with the webhook configurations.
          secret: {secretName: evalsi-operator-webhook-tls}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: evalsi-operator-webhook
  labels: {{- include "evalsi.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: evalsi-operator}
  ports:
    - {name: webhook, port: 443, targetPort: webhook}
{{- end }}
