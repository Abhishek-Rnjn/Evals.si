{{- if .Values.operator.enabled }}
{{- $fn := include "evalsi.fullname" $ -}}
{{- $v := .Values }}
{{- $ns := .Release.Namespace }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fn }}-operator
  labels: {{- include "evalsi.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fn }}-operator
  labels: {{- include "evalsi.labels" . | nindent 4 }}
rules:
  - apiGroups: [evals.si]
    resources: [evalruns, onlineevalpolicies, tracesources, evaluators]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [evals.si]
    resources: [evalruns/status, evalruns/finalizers, onlineevalpolicies/status, onlineevalpolicies/finalizers, tracesources/status, tracesources/finalizers, evaluators/status]
    verbs: [get, update, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [configmaps, services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [keda.sh]
    resources: [scaledobjects]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fn }}-operator
  labels: {{- include "evalsi.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $fn }}-operator}
subjects:
  - {kind: ServiceAccount, name: {{ $fn }}-operator, namespace: {{ $ns }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-operator
  labels: {{- include "evalsi.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $fn }}-operator
spec:
  replicas: {{ $v.operator.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $fn }}-operator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $fn }}-operator, app.kubernetes.io/part-of: evalsi}
    spec:
      serviceAccountName: {{ $fn }}-operator
      securityContext: {{- include "evalsi.podSecurity" . | nindent 8 }}
      {{- with .Values.operator.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          image: {{ include "evalsi.image" . }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          command: [evalsi-operator]
          args:
            - --evalsid-url={{ include "evalsi.serverURL" . }}
            {{- if $v.server.tls }}
            - --ca-file=/etc/evalsi/server-tls/ca.crt
            {{- end }}
            # Its own service-account token, projected for evalsid.
            - --token-file=/var/run/secrets/evals.si/token
            - --namespace={{ $ns }}
            {{- if not $v.operator.allNamespaces }}
            - --watch-namespace={{ $ns }}
            {{- end }}
            - --controllers=evalrun,onlineevalpolicy,tracesource,evaluator{{ if $v.operator.sandboxClasses }},sandboxclass{{ end }}
            - --image={{ include "evalsi.image" . }}
            - --sandbox-tls-secret={{ $fn }}-sandbox-tls
            - --sandbox-allow-client={{ $fn }}-worker
            - --sandbox-service-account={{ $fn }}-sandboxd
            - --worker-config-map={{ $fn }}-worker
            {{- if include "evalsi.sandboxAddress" . }}
            - --worker-tls-secret={{ $fn }}-worker-tls
            {{- end }}
            {{- with (include "evalsi.storage" . | fromJson).s3.credentialsSecret }}
            - --worker-s3-secret={{ . }}
            {{- end }}
            - --name-prefix={{ $fn }}
            - --nats-monitoring-endpoint={{ $fn }}-nats.{{ $ns }}.svc:8222
            - --create-projects={{ $v.operator.createProjects }}
            - --webhooks={{ $v.operator.webhooks }}
            - --webhook-cert-dir=/etc/evalsi/webhook-tls
            - --leader-elect={{ gt (int $v.operator.replicas) 1 }}
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          ports:
            - {name: webhook, containerPort: 9443}
            - {name: metrics, containerPort: 8080}
            - {name: health, containerPort: 8081}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 20
          securityContext: {{- include "evalsi.restricted" . | nindent 12 }}
          resources: {{- toYaml $v.operator.resources | nindent 12 }}
          volumeMounts:
            - {name: token, mountPath: /var/run/secrets/evals.si, readOnly: true}
            {{- if $v.server.tls }}
            - {name: server-tls, mountPath: /etc/evalsi/server-tls, readOnly: true}
            {{- end }}
            {{- if $v.operator.webhooks }}
            - {name: webhook-tls, mountPath: /etc/evalsi/webhook-tls, readOnly: true}
            {{- end }}
      volumes:
        - name: token
          projected:
            sources:
              - serviceAccountToken: {audience: {{ $v.auth.kubernetes.audience }}, expirationSeconds: 3600, path: token}
        {{- if $v.server.tls }}
        - name: server-tls
          secret: {secretName: {{ $fn }}-server-tls, items: [{key: ca.crt, path: ca.crt}]}
        {{- end }}
        {{- if $v.operator.webhooks }}
        - name: webhook-tls
          # Issued by the evalsi-crds chart with the webhook configurations.
          secret: {secretName: {{ $fn }}-operator-webhook-tls}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-operator-webhook
  labels: {{- include "evalsi.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: {{ $fn }}-operator}
  ports:
    - {name: webhook, port: 443, targetPort: webhook}
{{- if and $v.operator.webhooks $v.operator.istio.peerAuthentication }}
---
# Under mesh-wide STRICT mTLS the API server is outside the mesh and cannot
# reach the admission webhooks; this lets plaintext in on the webhook port only.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: {{ $fn }}-operator-webhook
  labels: {{- include "evalsi.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $fn }}-operator}
  mtls: {mode: STRICT}
  portLevelMtls:
    9443: {mode: PERMISSIVE}
{{- end }}
{{- end }}
