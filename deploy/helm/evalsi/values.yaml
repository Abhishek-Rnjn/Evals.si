# Names this chart creates start with the release's name (a release named
# for evalsi, such as "evalsi", is used as it is; any other gets "-evalsi"
# after it). Set this to choose the prefix. The evalsi-crds chart's
# evalsiFullname must match it.
fullnameOverride: ""

# The evalsi image (evalsid, the Python worker, evalsi-guest, the operator).
image:
  repository: ghcr.io/abhishek-rnjn/evalsi
  tag: ""                 # default: the chart's appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

global:
  # Air-gapped installs: pull every image from this registry instead (the
  # bundle pushes them there under the same paths, docker.io/library
  # images at their short names).
  imageRegistry: ""

# evalsid serve: the API, OTLP ingest, the run scheduler and the policy
# engine. Several replicas need storage.postgres; the scheduler and policy
# engine then run on one of them at a time (leases), ingest on all.
server:
  replicas: 1
  resources: {}
  # Serve TLS with the chart's internal CA (clients outside the cluster
  # usually reach it through an ingress or agentgateway instead).
  tls: true
  otlp:
    enabled: true         # 4317 (gRPC) and 4318 (HTTP) beside the API on 8080
  # Without postgres: SQLite on this volume (one replica only).
  persistence:
    enabled: false
    size: 10Gi
    storageClassName: ""
  # Merged into evalsi.yaml as is: judges, sinks, policies, runs, traces...
  config: {}
  env: []
  envFrom: []             # e.g. [{secretRef: {name: evalsi-providers}}] for ANTHROPIC_API_KEY
  nodeSelector: {}
  tolerations: []

storage:
  postgres:
    # A Secret key holding the DSN (postgres://user:pass@host/db?sslmode=verify-full).
    dsnSecret: {name: "", key: dsn}
  clickhouse:
    url: ""               # http(s)://clickhouse:8123
    database: evalsi
    user: ""
    passwordSecret: {name: "", key: password}
  s3:
    endpoint: ""          # s3.amazonaws.com, or minio:9000
    bucket: ""            # datasets_dir becomes s3://<bucket>/<prefix>
    prefix: datasets
    region: ""
    # A Secret with access_key and secret_key; empty uses the standard chain
    # (IRSA and other web identity, the node's role).
    credentialsSecret: ""
    insecure: false
    pathStyle: true

# A throwaway PostgreSQL in the namespace, for trying several replicas out.
# Not for production: no backups, no HA.
devPostgres:
  enabled: false
  image: postgres:17
  storage: 5Gi
  nodeSelector: {}
  tolerations: []
  serviceLabels: {}       # e.g. istio.io/use-waypoint: none

# A throwaway S3-compatible store (MinIO) in the namespace, for trials without
# a cloud's. When on, storage.s3 is filled in for you (bucket: storage.s3.bucket,
# default evalsi). Not for production: no backups, no HA.
devMinio:
  enabled: false
  image: bitnamilegacy/minio:2025.7.23
  storage: 5Gi
  storageClassName: ""
  nodeSelector: {}
  tolerations: []
  serviceLabels: {}

# A throwaway ClickHouse in the namespace, for trace storage in trials. When on,
# storage.clickhouse is filled in for you. Not for production: no backups, no HA.
devClickhouse:
  enabled: false
  image: clickhouse/clickhouse-server:25.8
  storage: 5Gi
  storageClassName: ""
  nodeSelector: {}
  tolerations: []
  serviceLabels: {}

# NATS JetStream: the work queues, the span stream, events and leases' signals.
nats:
  # An existing NATS (for example the official chart, three nodes): its URL.
  url: ""
  # Otherwise one JetStream node in the namespace.
  image: nats:2.12-alpine
  storage: 10Gi
  storageClassName: ""
  resources: {}
  # Stream replicas (3 on a three-node cluster).
  streamReplicas: 1
  nodeSelector: {}
  tolerations: []
  # Extra Service labels. NATS speaks first, which a mesh waypoint breaks:
  # under Istio ambient set istio.io/use-waypoint: none.
  serviceLabels: {}

auth:
  # Accept the cluster's service-account tokens (the operator, CI jobs,
  # agents) projected for this audience.
  kubernetes:
    enabled: true
    audience: evals.si
    namespaces: []        # default: every namespace
    # evalsid reads the cluster's issuer and signing keys from the API
    # server, which every service account may do unless the cluster removed
    # that grant (system:service-account-issuer-discovery). Then set the
    # issuer and a key set: the cluster's public one (EKS, GKE and AKS
    # publish it) as jwks.url, or a copy in a ConfigMap (key keys.json),
    # refreshed when the cluster rotates its keys.
    issuer: ""
    jwks: {}              # {url: https://...} or {inline: {...}}
    jwksConfigMap: ""
  # Merged into the auth section: jwt providers, api_keys, trusted_proxy...
  config: {}
# Merged into the rbac section; the operator is always an owner.
rbac:
  owners: []
  projects: {}
  roles: []

# Workers per pool: evalsid worker processes driving a Python worker.
workers:
  pools:
    cpu: {replicas: 1, concurrency: 8, resources: {}}
    judge: {replicas: 1, concurrency: 16, resources: {}}
    sandbox: {replicas: 1, concurrency: 4, resources: {}}
    harness: {replicas: 1, concurrency: 2, resources: {}}
    # gpu: {replicas: 1, concurrency: 1, resources: {limits: {nvidia.com/gpu: 1}}, nodeSelector: {...}}
    # A pool on your own image (FROM the evalsi image, plus your evaluator
    # package), without the operator's Evaluator resource:
    # graders: {replicas: 1, concurrency: 8, image: registry.internal/graders:1.4}
  # Merged into the workers' evalsi.yaml (judges, default_judge, agents...).
  config: {}
  env: []
  envFrom: []
  nodeSelector: {}
  tolerations: []

# KEDA scaling per pool on its JetStream consumer's backlog (KEDA must be
# installed). Replaces workers.pools.*.replicas.
keda:
  enabled: false
  minReplicas: 1
  maxReplicas: 20
  lagThreshold: 10
  pollingInterval: 10

sandbox:
  # Where workers run agent sandboxes and code evaluators: a sandbox pool
  # (tls://evalsi-sandboxd.<namespace>.svc:7443 from the evalsi-sandboxd
  # chart, or a SandboxClass's status.address). Empty: in the worker pods,
  # which then need the privileges bwrap needs.
  address: ""
  # The pod rung: a service account pools may run as, allowed to manage
  # sandbox pods here, and a NetworkPolicy confining those pods.
  podRung:
    enabled: true
    networkPolicy: true
  # A sandbox pool run by this chart (evalsi-sandbox-pool), for installs
  # without the cluster-scoped charts: the pod rung (a pod per sandbox) and
  # Landlock need no privilege and run under Pod Security "restricted".
  # Workers use it unless sandbox.address is set.
  pool:
    enabled: false
    ladder: [pod]         # pod and/or landlock, strongest first
    minIsolation: ""
    replicas: 1
    maxSandboxes: 8       # per replica
    resources: {}
    nodeSelector: {}
    tolerations: []
    # The pod rung's sandbox pods.
    pod:
      defaultImage: python:3.13-slim   # for sandboxes whose spec names no image
      # Non-root and no capabilities: what "restricted" admits. The image's
      # workdir is copied into a volume this user can write. null runs as
      # the image's user with the capabilities apt and pip need.
      runAsUser: 65532
      capabilities: []
      runtimeClassName: ""             # gvisor or kata, with level kernel or vm
      level: ""
      cpu: ""
      startTimeout: ""
      networkPolicyEnforced: false     # true when the CNI enforces NetworkPolicy
      nodeSelector: {}
      tolerations: []
      labels: {}                       # extra labels, e.g. istio.io/use-waypoint: none

operator:
  enabled: true
  replicas: 1
  # Reconcile SandboxClasses (cluster-scoped: needs evalsi-crds with
  # operator.sandboxClasses).
  sandboxClasses: false
  # Watch EvalRuns and the rest in every namespace (needs evalsi-crds with
  # operator.allNamespaces); default: this namespace.
  allNamespaces: false
  # Serve the admission webhooks (evalsi-crds installs their configuration
  # and certificate).
  webhooks: true
  createProjects: true
  istio:
    # Render a PeerAuthentication that lets the API server reach the admission
    # webhooks (port 9443 PERMISSIVE) under mesh-wide STRICT mTLS. Off by
    # default: it needs Istio's CRDs.
    peerAuthentication: false
  resources: {}
  nodeSelector: {}
  tolerations: []

tls:
  # Internal certificates (the API, sandbox pools, worker client
  # certificates) from cert-manager instead of the chart's own CA.
  certManager:
    enabled: false
    issuerRef: {}         # {name: ..., kind: ClusterIssuer}

# A Grafana dashboard for evalsid's /metrics (runs, online evaluation and
# rewards), as a ConfigMap for Grafana's dashboard sidecar.
grafana:
  dashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"
