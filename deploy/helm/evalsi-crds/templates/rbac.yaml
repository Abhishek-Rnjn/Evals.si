{{- $ns := .Values.operator.namespace }}
{{- $fn := include "crds.fullname" . }}
{{- if or .Values.operator.sandboxClasses .Values.operator.allNamespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fn }}-operator
rules:
  {{- if .Values.operator.sandboxClasses }}
  - apiGroups: [evals.si]
    resources: [sandboxclasses]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [evals.si]
    resources: [sandboxclasses/status]
    verbs: [get, update, patch]
  {{- end }}
  {{- if .Values.operator.allNamespaces }}
  - apiGroups: [evals.si]
    resources: [evalruns, onlineevalpolicies, evaluators]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [evals.si]
    resources: [evalruns/status, evalruns/finalizers, onlineevalpolicies/status, onlineevalpolicies/finalizers, evaluators/status]
    verbs: [get, update, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [keda.sh]
    resources: [scaledobjects]
    verbs: [get, list, watch, create, update, patch, delete]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fn }}-operator
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $fn }}-operator}
subjects:
  - {kind: ServiceAccount, name: {{ .Values.operator.fullname }}-operator, namespace: {{ $ns }}}
{{- end }}
---
# Who may use evals.si resources: aggregated into the built-in roles, so
# namespace admins and editors manage them and viewers read them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fn }}-edit
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
  - apiGroups: [evals.si]
    resources: [evalruns, onlineevalpolicies, evaluators]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fn }}-view
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: [evals.si]
    resources: [evalruns, onlineevalpolicies, evaluators, sandboxclasses]
    verbs: [get, list, watch]
