image:
  repository: ghcr.io/abhishek-rnjn/evalsi
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
global:
  imageRegistry: ""

# bwrap: bubblewrap and Landlock, as root in a user namespace with an
#   unmasked /proc and no seccomp or AppArmor profile (needs Kubernetes user
#   namespaces: 1.33+, a runtime and kernel that support them).
# privileged: the same rungs in a privileged container, for nodes without
#   user namespaces (and kind, whose nodes are containers).
# firecracker: microVMs, privileged with /dev/kvm (KVM nodes only).
mode: bwrap
minIsolation: namespaced
maxSandboxes: 32
firecracker:
  kernel: /var/lib/evalsi/vmlinux   # on the node (mounted from hostPath)
  warmPool: 2
  vcpus: 2
  memoryMB: 2048
  # Required: the OCI image a microVM boots when a spec names none (moved
  # under global.imageRegistry like the others). sandboxd boots it at start.
  defaultImage: ""
  # Root disk size per microVM; 0: sandboxd's default.
  diskMB: 0

# The evalsi chart's sandbox certificate (server) and the clients pools
# admit (its workers' certificate name).
tlsSecret: evalsi-sandbox-tls
allowClients: [evalsi-worker]

# Route each worker to the pool on its own node (needs a pool on every
# node that runs workers).
nodeLocal: false
resources: {}
# Extra pod labels, e.g. to opt the pool out of a service mesh's waypoint
# (istio.io/use-waypoint: none).
podLabels: {}
serviceLabels: {}
nodeSelector: {}
tolerations: []
