# A sandbox pool on the pod rung: one hardened pod per sandbox.
apiVersion: evals.si/v1alpha1
kind: SandboxClass
metadata:
  name: pods
spec:
  ladder: [pod]
  minIsolation: namespaced
  pod:
    defaultImage: airgap.invalid/python:3.13-slim
    # kind's default CNI (kindnet) does not enforce NetworkPolicy, so the
    # isolation report must not claim it; set true where the CNI does.
    networkPolicyEnforced: false
