# M3: a source on the demo MLflow for scripts/measure-trace-source.py, which
# applies it, times its 30-day backfill and the pull lag of live traces.
apiVersion: evals.si/v1alpha1
kind: TraceSource
metadata:
  name: m3
  labels: {evals.si/project: demo}
spec:
  connector: mlflow
  endpoint: http://evalsi-demo-mlflow:5000
  locations: [m3-backfill]
  backfill: {since: 744h}    # 31 days: the seeded history is 30
  poll: {interval: 15s}
  policies: [m3-policy]
