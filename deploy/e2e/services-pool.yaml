# Local e2e fixture. services-kind.sh creates the ephemeral mutual TLS secret.
apiVersion: v1
kind: Namespace
metadata:
  name: evalsi-services
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pool
  namespace: evalsi-services
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pool
  namespace: evalsi-services
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, create, delete]
- apiGroups: [""]
  resources: [pods/log]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pool
  namespace: evalsi-services
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: pool}
subjects:
- {kind: ServiceAccount, name: pool, namespace: evalsi-services}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pool
  namespace: evalsi-services
data:
  evalsi.yaml: |
    sandbox:
      ladder: [pod]
      max_sandboxes: 4
      pod:
        namespace: evalsi-services
        guest_image: evalsi-services:test
        default_image: python:3.13-slim
        network_policy_enforced: true
        capabilities: []
        start_timeout: 90s
---
apiVersion: v1
kind: Pod
metadata:
  name: pool
  namespace: evalsi-services
  labels: {app: pool}
spec:
  serviceAccountName: pool
  containers:
  - name: pool
    image: evalsi-services:test
    imagePullPolicy: Never
    args: [sandbox, serve, --config=/etc/evalsi/evalsi.yaml, --listen=tcp://0.0.0.0:7443,
      --tls-cert=/etc/tls/tls.crt, --tls-key=/etc/tls/tls.key,
      --client-ca=/etc/tls/ca.crt, --allow-client=services-e2e-client]
    env:
    - name: POD_NAMESPACE
      valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
    - name: POD_IP
      valueFrom: {fieldRef: {fieldPath: status.podIP}}
    - name: POD_NAME
      valueFrom: {fieldRef: {fieldPath: metadata.name}}
    - name: POD_UID
      valueFrom: {fieldRef: {fieldPath: metadata.uid}}
    readinessProbe:
      tcpSocket: {port: 7443}
      periodSeconds: 1
    volumeMounts:
    - {name: config, mountPath: /etc/evalsi, readOnly: true}
    - {name: tls, mountPath: /etc/tls, readOnly: true}
  volumes:
  - name: config
    configMap: {name: pool}
  - name: tls
    secret: {secretName: pool-tls}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-isolation
  namespace: evalsi-services
spec:
  podSelector:
    matchLabels: {evals.si/sandbox: "true"}
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - podSelector: {matchLabels: {app: pool}}
  egress:
  - to:
    - podSelector: {matchLabels: {app: pool}}
