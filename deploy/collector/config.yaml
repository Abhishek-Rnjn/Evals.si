# Default evalsi-collector config: OTLP in, traces to evalsid's OTLP
# endpoint (EVALSI_OTLP_ENDPOINT, host:port) over TLS with a bearer token
# (EVALSI_TOKEN: an API key or a service-account token). For a local evalsid
# without TLS or authentication, use config-dev.yaml. To send a copy to
# another backend, add an exporter to the traces pipeline.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  bearertokenauth/evalsi:
    token: ${env:EVALSI_TOKEN}

receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch:
    send_batch_size: 1024
    timeout: 2s
  # Uncomment to keep prompt and completion text out of everything downstream.
  # attributes/redact:
  #   actions:
  #     - {key: gen_ai.prompt, action: delete}
  #     - {key: gen_ai.completion, action: delete}

exporters:
  otlp/evalsi:
    endpoint: ${env:EVALSI_OTLP_ENDPOINT}
    auth: {authenticator: bearertokenauth/evalsi}
  debug: {verbosity: basic}

service:
  extensions: [health_check, bearertokenauth/evalsi]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/evalsi]
