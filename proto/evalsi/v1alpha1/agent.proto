syntax = "proto3";

package evalsi.v1alpha1;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";

// Agent runs (design §11). A run with a harness, or with an agent target,
// drives an agent through each record as a task: the record's input is the
// instruction, the environment is a sandbox the agent works in, and the
// environment's checker grades the end state. The trajectory, the checker's
// verdict and any sandbox policy events are stored on the record, where the
// agent pack's evaluators read them.

// AgentTarget is a bring-your-own agent. Without one, a run with a harness
// uses the built-in reference agent on the target's model.
message AgentTarget {
  oneof kind {
    A2AAgent a2a = 1;
    MCPAgent mcp = 2;
    ResponsesAgent responses = 3;
    HTTPAgent http = 4;
    CLIAgent cli = 5;
  }
}

// An agent that speaks the Agent2Agent protocol (JSON-RPC message/send).
message A2AAgent {
  string url = 1;
  // HTTP header -> environment variable holding its value (read by the worker).
  map<string, string> headers_env = 2;
  // For streaming, the longest silence tolerated between events.
  google.protobuf.Duration timeout = 3;
  // Use message/stream (server-sent events) instead of message/send and
  // polling, so each task state and artifact chunk the agent reports becomes
  // a step. The agent's card must declare streaming.
  bool stream = 4;
}

// An agent exposed as a tool on an MCP server (streamable HTTP).
message MCPAgent {
  string url = 1;
  // The tool to call; default: the server's only tool.
  string tool = 2;
  // The argument that receives the instruction; default "input".
  string argument = 3;
  map<string, string> headers_env = 4;
  google.protobuf.Duration timeout = 5;
}

// An agent behind an OpenAI Responses-compatible endpoint (POST /responses).
message ResponsesAgent {
  string base_url = 1;
  string model = 2;
  string api_key_env = 3;
  google.protobuf.Duration timeout = 4;
}

// Any HTTP agent: the instruction goes into a JSON body template and the
// answer comes out of a path in the JSON response.
message HTTPAgent {
  string url = 1;
  // "POST" by default.
  string method = 2;
  map<string, string> headers_env = 3;
  // JSON with {{input}} (the instruction, JSON-escaped) and {{task_id}}.
  // Default: {"input": {{input}}}.
  string body_template = 4;
  // Dotted path to the answer in the response, for example "output.text".
  string output_path = 5;
  // Dotted path to an OpenAI-style message list, kept as the trajectory.
  string messages_path = 6;
  google.protobuf.Duration timeout = 7;
}

// A command-line agent (a coding agent, for example) run inside the task's
// sandbox, in its workdir. The instruction is passed in place of
// {instruction} in the command, or on stdin when no argument has it.
message CLIAgent {
  repeated string command = 1;
  // Commands run once in the environment before the agent (installing it).
  repeated string install = 2;
  // Variable in the sandbox -> variable on the worker it is copied from, for
  // the agent's own model credentials. Nothing else is passed in.
  map<string, string> env_from = 3;
  // Hosts the agent may reach (its model API), through the egress proxy.
  repeated string allow_hosts = 4;
  google.protobuf.Duration timeout = 5;
  // How to read the program's standard output. Empty: the output is the
  // answer, and the run has one step. Otherwise the program's structured event
  // stream is read as model calls, tool calls and the final answer: "dsh-json"
  // (`dsh --profile headless --json`), "claude-stream-json" (`claude -p
  // --output-format stream-json --verbose`), "codex-json" (`codex exec
  // --json`), "gemini-json" (`gemini --output-format stream-json`) or
  // "pi-json" (`pi --mode json`).
  string output_format = 6;
}

// Harness drives the agent through a task.
message Harness {
  oneof kind {
    BuiltinHarness builtin = 1;
    ExternalHarness external = 2;
  }
}

message AgentBudget {
  // Spend, from token usage and the pricing below.
  double usd = 1;
  google.protobuf.Duration wall_clock = 2;
  int64 tokens = 3;
}

// Prices for turning token usage into spend, per million tokens.
message Pricing {
  double input_per_mtok = 1;
  double output_per_mtok = 2;
}

// An MCP server whose tools the agent may call.
message MCPServer {
  // A name used to prefix its tools when names collide.
  string name = 1;
  // Streamable HTTP endpoint.
  string url = 2;
  // Or a command started on the worker that speaks MCP over stdio. It runs
  // outside the sandbox, so it must come from trusted configuration.
  repeated string command = 3;
  map<string, string> headers_env = 4;
  // Only these tools; all when empty.
  repeated string tools = 5;
  // Seconds a request to the server may take (default 120), and per tool
  // (by name) where a tool needs more or less.
  int32 timeout_s = 6;
  map<string, int32> tool_timeout_s = 7;
  // Also offer the server's resources and prompts, as <name>_resources and
  // <name>_prompts tools.
  bool resources = 8;
  bool prompts = 9;
  // Let the server ask the user questions mid-call (MCP elicitation), answered
  // by the user simulator, which spec.harness.builtin.user_simulator must set.
  bool elicitation = 10;
  // Reach a url server with an OAuth 2 client-credentials token.
  MCPOAuth oauth = 11;
}

// OAuth 2 client credentials: the machine flow, since a run has no one to
// approve a browser redirect. The two variables are read by the worker and,
// on a server, must be granted to the run's project (credentials.grants).
message MCPOAuth {
  string token_url = 1;
  string client_id_env = 2;
  string client_secret_env = 3;
  string scope = 4;
}

// A tool answered from the spec instead of a live system.
message MockTool {
  string name = 1;
  string description = 2;
  // JSON Schema for the arguments.
  google.protobuf.Struct input_schema = 3;
  // The answer, or answers by exact arguments (JSON, keys sorted).
  string response = 4;
  map<string, string> responses = 5;
}

// A fault injected into tool calls, for robustness tests.
message ToolFault {
  // Tool name, or "*" for every tool.
  string tool = 1;
  // "timeout", "error" or "malformed".
  string kind = 2;
  // Probability per call, 0 to 1. Faults are seeded per task and trial, so
  // a rerun injects the same faults.
  double rate = 3;
}

message Tools {
  // The sandbox tools (bash, read_file, write_file, list_files). On by
  // default when the task has an environment.
  optional bool sandbox = 1;
  repeated MCPServer mcp = 2;
  repeated MockTool mocks = 3;
  repeated ToolFault faults = 4;
  // More built-in tools to offer, by name: edit_file (exact-match replace),
  // glob, grep, apply_patch (a unified diff), memory (notes that survive
  // context management), session_search (find and re-read what context
  // management removed) delegate (hand a subtask to a sub-agent with a
  // fresh context and keep only its report) tool_search (the MCP tools
  // start unloaded and the agent loads the ones it needs by searching) and
  // code_mode (the agent sees one tool, run_code, and acts by writing a script
  // that calls the other tools as functions; only what it prints comes back). Off by default, so a comparison between models uses
  // the same toolset unless a spec says so.
  repeated string builtin = 5;
}

// An LLM-driven simulated user with a persona and goal, for multi-turn tasks
// in the style of tau-bench. It speaks with the run's judge model.
message UserSimulator {
  // Judge name; the run's judge when empty.
  string judge = 1;
  string persona = 2;
  // The user's goal; default: the record's input.
  string goal = 3;
  // Turns the simulated user may take; default 10.
  int32 max_turns = 4;
}

// Record and replay of model calls and tool I/O. A recording is a session
// log: every model turn and tool result is written as it happens, so a trial
// that dies leaves everything up to its last step.
message Recording {
  // "off" (default), "record", "replay", "resume" or "fork".
  //   record: start a new log (replacing one).
  //   replay: serve a log's model turns and tool results (sandbox tools run
  //     again, so the environment is rebuilt); with branch_at_step, replay
  //     the first N turns and then continue live without saving.
  //   resume: continue an interrupted trial: replay its log, then run live
  //     and append to the same log. A trial with no log starts one.
  //   fork: replay the first branch_at_step turns of a log, then run live,
  //     writing a new log (fork_as) that holds that prefix and the new
  //     continuation and names the log it forked from.
  string mode = 1;
  // Directory for cassettes, one per task and trial. Embedded: relative to
  // the spec. Server: inside datasets_dir.
  string dir = 2;
  // replay and fork: the number of model turns to replay before going live.
  // Required for fork.
  int32 branch_at_step = 3;
  // fork: the new log's name (letters, digits, dots, dashes and underscores);
  // default: the source's name with ".fork-N".
  string fork_as = 4;
}

// What the harness does when a sandbox denies something and the agent asks
// for a wider policy. With no human in the loop, it denies by default.
message EscalationPolicy {
  // Escalations that are granted: "network".
  repeated string allow = 1;
}

message BuiltinHarness {
  // Model calls the agent may make; default 30.
  int32 max_steps = 1;
  AgentBudget budget = 2;
  Pricing pricing = 3;
  Tools tools = 4;
  UserSimulator user_simulator = 5;
  Recording recording = 6;
  EscalationPolicy escalation = 7;
  // Run a model's parallel tool calls concurrently (default true).
  optional bool parallel_tool_calls = 8;
  // Appended to the agent's system prompt.
  string instructions = 9;
  // Keeps long runs inside the model's context window. Unset: the whole
  // conversation is resent every step.
  ContextManagement context = 10;
  // Python hooks at the agent's lifecycle points, called in this order.
  repeated Hook hooks = 11;
  // With "delegate" among tools.builtin: the model calls a sub-agent may make
  // for one task (default 20). Its budget comes out of the parent's.
  int32 delegate_steps = 12;
  // A versioned profile of the agent: "minimal" (a short prompt and four
  // tools: bash, read_file, write_file, edit_file; no escalation tool),
  // "standard" (the H2 toolset, and compaction when context.window_tokens is
  // set without a strategy) or "code-mode" (run_code over edit_file, glob and
  // grep). "name" is the latest version, "name@1" pins one. A profile owns the
  // toolset, so it cannot be combined with tools.builtin. The run's metadata
  // and a recording's guard carry the resolved "name@version".
  string profile = 13;
  // Messages the user sends while the agent works, at fixed points. Each is
  // delivered as a user message at the start of the model call after the
  // agent's at_step-th call (or when the agent tries to finish with one still
  // due), recorded as a "user-interjection" step. Built-in agent only.
  repeated Interjection interjections = 14;
}

// A scripted message from the simulated user, mid-run.
message Interjection {
  // Delivered once the agent has made this many model calls (at least 1).
  int32 at_step = 1;
  string message = 2;
}

// A Python class "module:Class" with any of before_model, before_tool,
// after_tool, on_compaction and on_stop methods, built as Class(config). On a
// server the class must be listed under agents.trusted_python. A recording
// replays only with the same hooks.
message Hook {
  string python = 1;
  google.protobuf.Struct config = 2;
}

// How the built-in agent handles a conversation that grows past its context
// window. The prompt size is counted from the model's last reported usage.
// Every clear or compaction is a step on the trajectory, and a recorded run
// replays only with the same strategy and window.
message ContextManagement {
  // "none" (default), "clear-tool-results" (replace old tool results with a
  // stub), "compact" (clear first, then summarize earlier turns with the
  // agent's own model) or "fresh-rounds" (the Ralph pattern: each round is a
  // new agent with a clean context that starts from the task and the notes it
  // kept in the memory file progress.md; the run ends when a reply carries
  // TASK_COMPLETE, or after `rounds` rounds) or "evidence-state" (an evidence
  // list whose entries must quote what the agent read, and a conclusion list
  // with open gaps, kept outside the conversation, shown on every call and
  // carried over when old turns are dropped).
  string strategy = 1;
  // The model's context window in tokens; required for clear-tool-results,
  // compact and evidence-state.
  int32 window_tokens = 2;
  // Start when the prompt reaches this fraction of the window (default 0.8)...
  double trigger = 3;
  // ...and clear or compact down to this fraction (default 0.5). Clearing in
  // batches, not a little every turn, keeps the provider's prompt cache warm.
  double target = 4;
  // Tool results kept intact, newest first (default 4).
  int32 keep_recent = 5;
  // Assistant turns kept verbatim after a summary (default 6).
  int32 keep_turns = 6;
  // Output limit for the summary (default 4096).
  int32 summary_max_tokens = 7;
  // Write a large bash output to a file in the sandbox (.evalsi-out/) and
  // return its head, tail and path, instead of clipping it in the middle.
  bool spill_outputs = 8;
  // fresh-rounds: the most rounds (default 5) and the model calls one round
  // may make (default 30).
  int32 rounds = 9;
  int32 round_steps = 10;
}

// A harness you bring: anything that implements evalsi.harness.v1alpha1.HarnessService.
message ExternalHarness {
  oneof kind {
    // A running gRPC service, for example "dns:///harness:50051" or "unix:///path".
    string address = 1;
    // A command the worker starts; it serves on the Unix socket named by
    // EVALSI_HARNESS_LISTEN.
    CommandHarness command = 2;
    // A Python class, "module:Class", loaded in the worker.
    string python = 3;
  }
  google.protobuf.Struct config = 4;
}

message CommandHarness {
  repeated string argv = 1;
}

// The sandbox policy for an environment.
message SandboxPolicy {
  // none, confined, namespaced, kernel or vm. Default: namespaced.
  string min_isolation = 1;
  // "deny" (default), "allowlist" or "allow".
  string network = 2;
  repeated string allow_hosts = 3;
  int32 memory_mb = 4;
  int32 max_procs = 5;
  // The agent's working directory; default /workspace.
  string workdir = 6;
  bool read_only_root = 7;
}

// Checker grades the environment after the agent finishes.
message Checker {
  // Run in the sandbox after the agent. Without a parser, exit 0 passes.
  repeated string command = 1;
  // Copied in only for checking (hidden tests the agent never sees).
  map<string, string> files = 2;
  google.protobuf.Duration timeout = 3;
  // How to read the result: "exit-code" (default); "json" (the last line of
  // stdout is {"passed": bool, "score": number, "tests": {...}}); "junit:<path>";
  // or a Python function "module:function" taking (stdout, stderr, exit_code, task).
  string parser = 4;
  // Glob patterns, relative to the workdir ("tests/**", "**/conftest.py"), of
  // files the agent must not change. They are hashed when each trial starts and
  // compared before the checker runs; a change (modified, deleted or new under
  // a pattern) is a guardrail step on the trajectory. Workdir only: tampering
  // outside it needs sandbox.read_only_root.
  repeated string protect = 5;
  // What a change does: "fail" (default) fails the trial without running the
  // checker; "restore" writes the originals back and removes new files, then
  // runs the checker.
  string on_change = 6;
}

// Environment is where a task runs. Spec-level values apply to every record;
// a record's metadata["environment"] (same fields) overrides them per task.
message Environment {
  // OCI image for the root filesystem; empty: the host's system directories.
  string image = 1;
  // Placed in the workdir before setup.
  map<string, string> files = 2;
  // Shell commands run once per environment, before any trial; the result is
  // snapshotted, so trials start from the same state.
  repeated string setup = 3;
  google.protobuf.Duration setup_timeout = 4;
  // Network during setup only (package downloads); default: the sandbox's.
  string setup_network = 5;
  repeated string setup_allow_hosts = 6;
  SandboxPolicy sandbox = 7;
  Checker checker = 8;
  map<string, string> env = 9;
  // Per-command timeout for the agent's sandbox commands; default 120s.
  google.protobuf.Duration command_timeout = 10;
  // Pod backend only. Private, per-trial services; no shared persistent data.
  repeated EnvironmentService services = 11;
  // Required with services, from 1s to 24h. Bounds orphaned service execution.
  google.protobuf.Duration service_lifetime = 12;
}

// EnvironmentService is a native Kubernetes sidecar (Kubernetes 1.29+).
// Services share the trial's network, but not its filesystem or credentials.
message EnvironmentService {
  // DNS label, also a loopback hostname inside this trial.
  string name = 1;
  string image = 2;
  // Explicit argv; image entrypoints are not implicitly executed.
  repeated string command = 3;
  map<string, string> env = 4;
  // TCP readiness port, unique within the trial; 7070 is reserved.
  int32 port = 5;
  // Services that must be ready first. Cycles are invalid.
  repeated string depends_on = 6;
  // Required limits; CPU in millicores, memory in MiB.
  int32 memory_mb = 7;
  int32 cpu_millis = 8;
}
