syntax = "proto3";

package evalsi.v1alpha1;

import "evalsi/v1alpha1/record.proto";
import "evalsi/v1alpha1/run.proto";
import "evalsi/v1alpha1/score.proto";

// RunService manages offline runs: create, follow, cancel, resume, compare.
// Runs are durable; every finished task is stored, so a resumed run skips it.
service RunService {
  rpc CreateRun(CreateRunRequest) returns (CreateRunResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  // Streams the run's state, then progress and results until it finishes.
  rpc WatchRun(WatchRunRequest) returns (stream WatchRunResponse);
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
  // Continues an errored or cancelled run, skipping finished tasks.
  rpc ResumeRun(ResumeRunRequest) returns (ResumeRunResponse);
  rpc ListRunResults(ListRunResultsRequest) returns (ListRunResultsResponse);
  // Paired comparison of two runs over the records they share.
  rpc CompareRuns(CompareRunsRequest) returns (CompareRunsResponse);
  // Appends a run's records that match a condition (failures, typically) to
  // a dataset, as regression cases: datasets_dir/promoted/<project>/<dataset>.jsonl.
  rpc PromoteResults(PromoteResultsRequest) returns (PromoteResultsResponse);
  // Shadow replay: re-runs recorded inputs (production traces, a promoted
  // dataset, an earlier run) against a candidate and scores the recorded
  // outputs the same way, as two runs to compare with CompareRuns.
  rpc CreateShadowReplay(CreateShadowReplayRequest) returns (CreateShadowReplayResponse);
}

message CreateRunRequest {
  string name = 1;
  string project = 2;
  RunSpec spec = 3;
  // Labels for access rules. Callers can only set labels their roles allow.
  map<string, string> labels = 4;
  // Check the request as creating it would (authorization, the spec,
  // credential grants and judges) without storing or starting anything; the
  // response has no run. Admission webhooks use it.
  bool validate_only = 5;
}

message CreateRunResponse {
  Run run = 1;
}

message GetRunRequest {
  string id = 1;
}

message GetRunResponse {
  Run run = 1;
}

message ListRunsRequest {
  string project = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListRunsResponse {
  // Newest first. Specs are omitted; use GetRun for the full run.
  repeated Run runs = 1;
  string next_page_token = 2;
}

message WatchRunRequest {
  string id = 1;
  // Also stream every evaluation result as it is stored.
  bool include_results = 2;
}

message WatchRunResponse {
  oneof event {
    // The run's state: sent first and whenever its status changes.
    Run run = 1;
    Progress progress = 2;
    EvaluationResult result = 3;
  }
}

message CancelRunRequest {
  string id = 1;
}

message CancelRunResponse {
  Run run = 1;
}

message ResumeRunRequest {
  string id = 1;
}

message ResumeRunResponse {
  Run run = 1;
}

message ListRunResultsRequest {
  string run_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  // Only this evaluator instance, when set.
  string evaluator = 4;
}

message ListRunResultsResponse {
  repeated EvaluationResult results = 1;
  // Records with the outputs the target produced, for the results on this page.
  repeated Record records = 2;
  string next_page_token = 3;
}

message CompareRunsRequest {
  string baseline_run_id = 1;
  string candidate_run_id = 2;
  // Defaults to 0.95.
  double confidence_level = 3;
}

message MetricComparison {
  string metric = 1;
  optional double baseline_mean = 2;
  optional double candidate_mean = 3;
  // Mean of per-record differences (candidate - baseline) over shared records.
  optional double diff = 4;
  ConfidenceInterval diff_ci = 5;
  int64 paired_n = 6;
  // The interval excludes zero.
  bool significant = 7;
}

message CompareRunsResponse {
  repeated MetricComparison comparisons = 1;
}

message PromoteResultsRequest {
  string run_id = 1;
  // Lowercase letters, digits, '.', '_' or '-'.
  string dataset = 2;
  // A CEL condition per record and trial over scores (metric -> value;
  // pass/fail as 1 or 0), errored (an evaluation errored), trial, and
  // record.id and record.metadata. For example: scores["task-success"] < 1.
  string when = 3;
  // Also keep the run's output, trajectory and check (for re-scoring and
  // shadow baselines); without it, only what the target or agent needs.
  bool include_outputs = 4;
}

message PromoteResultsResponse {
  int64 promoted = 1;
  // Relative to datasets_dir, usable as a dataset path in run specs.
  string path = 2;
}

message CreateShadowReplayRequest {
  string name = 1;
  string project = 2;
  // The candidate: a target or agent, its dataset (records with recorded
  // outputs) and evaluators. The baseline run scores the recorded outputs
  // with the same evaluators; gates apply to the candidate.
  RunSpec candidate = 3;
  map<string, string> labels = 4;
}

message CreateShadowReplayResponse {
  Run baseline = 1;
  Run candidate = 2;
}
