syntax = "proto3";

package evalsi.v1alpha1;

service DatasetService {
  rpc UploadDataset(stream UploadDatasetRequest) returns (UploadDatasetResponse);
  rpc ImportDataset(ImportDatasetRequest) returns (ImportDatasetResponse);
}

message DatasetUploadConfig {
  string project = 1;
  string name = 2;
  string format = 3;
}

message UploadDatasetRequest {
  oneof part {
    DatasetUploadConfig config = 1;
    bytes data = 2;
  }
}

message UploadDatasetResponse {
  string path = 1;
  int64 records = 2;
  string sha256 = 3;
}

message ImportDatasetRequest {
  DatasetUploadConfig config = 1;
  string uri = 2;
}

message ImportDatasetResponse {
  string path = 1;
  int64 records = 2;
  string sha256 = 3;
}
