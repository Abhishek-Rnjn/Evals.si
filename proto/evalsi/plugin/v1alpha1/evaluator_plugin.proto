syntax = "proto3";

package evalsi.plugin.v1alpha1;

import "evalsi/v1alpha1/evaluator.proto";
import "evalsi/v1alpha1/record.proto";
import "evalsi/v1alpha1/run.proto";
import "evalsi/v1alpha1/score.proto";
import "google/protobuf/struct.proto";

// EvaluatorPluginService is implemented by every out-of-process evaluator
// plugin: a subprocess in its own virtualenv, a container, or a remote
// service. The host does not care which. Plugins also implement the standard
// gRPC health protocol (grpc.health.v1.Health).
//
// Judge access: in v1alpha1 the worker is started with named judge configs and
// requests name one. A host-side judge service, so judge calls are cached,
// rate-limited and costed centrally across workers, replaces this later.
service EvaluatorPluginService {
  // Lists the evaluators this plugin hosts.
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  // Bidirectional streaming: the host pipelines batches and the plugin may
  // batch internally (GPU metrics, judges). Responses carry the batch_id of
  // the request they answer and may arrive out of order.
  rpc Evaluate(stream EvaluateRequest) returns (stream EvaluateResponse);
  // Dataset-scope metrics: computed over all records at once.
  rpc Reduce(ReduceRequest) returns (ReduceResponse);
  // Runs the target (the system under test) on records to produce outputs.
  rpc Generate(GenerateRequest) returns (GenerateResponse);
  // Loads a dataset (file or hf:// URI) and streams its records in chunks.
  rpc LoadDataset(LoadDatasetRequest) returns (stream LoadDatasetResponse);
}

message DescribeRequest {}

message DescribeResponse {
  repeated evalsi.v1alpha1.EvaluatorManifest evaluators = 1;
}

message EvaluateRequest {
  string batch_id = 1;
  // Manifest name, for example "acme/json-valid".
  string evaluator = 2;
  google.protobuf.Struct params = 3;
  repeated evalsi.v1alpha1.Record records = 4;
  // Name of a judge configured on the worker, for evaluators that require one.
  // v1alpha1 stand-in for the host-side judge service.
  string judge = 5;
}

message EvaluateResponse {
  string batch_id = 1;
  repeated evalsi.v1alpha1.EvaluationResult results = 2;
}

message ReduceRequest {
  string evaluator = 1;
  google.protobuf.Struct params = 2;
  // v1alpha1 sends full records. A partial-state form may be added for very
  // large datasets.
  repeated evalsi.v1alpha1.Record records = 3;
  // Per-record results from an earlier Evaluate phase, when there was one.
  repeated evalsi.v1alpha1.EvaluationResult results = 4;
  string judge = 5;
}

message ReduceResponse {
  repeated evalsi.v1alpha1.Score scores = 1;
}

message GenerateRequest {
  evalsi.v1alpha1.Target target = 1;
  repeated evalsi.v1alpha1.Record records = 2;
}

message GenerateResult {
  string record_id = 1;
  evalsi.v1alpha1.Content output = 2;
  evalsi.v1alpha1.Usage usage = 3;
  // Set when the target failed for this record; output is then empty.
  string error = 4;
}

message GenerateResponse {
  // One per request record, in order.
  repeated GenerateResult results = 1;
}

message LoadDatasetRequest {
  // path must already be absolute; the host resolves and checks it.
  evalsi.v1alpha1.DatasetSource source = 1;
}

message LoadDatasetResponse {
  repeated evalsi.v1alpha1.Record records = 1;
}
