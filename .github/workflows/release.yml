name: release

# Publishes a release from a tag (v0.5.0 releases version 0.5.0):
# - archives per architecture: static evalsid, evalsi-guest, evalsi-operator
#   and a static bubblewrap (scripts/release-binaries.sh);
# - Python wheels and sdists for evalsi and evalsi-harness, and platform wheels
#   of evalsi that bundle evalsid and bwrap for linux amd64 and arm64 (and PyPI, when the
#   repository variable PUBLISH_PYPI is "true" and trusted publishing is set up);
# - the images, multi-architecture, to ghcr.io/<owner>/evalsi:<version> and
#   ghcr.io/<owner>/evalsi-collector:<version>, each with BuildKit provenance
#   and an SBOM attached, signed keyless with cosign (GitHub's OIDC identity,
#   recorded in Rekor) and a cosign-attested SPDX SBOM;
# - the Helm charts, to oci://ghcr.io/<owner>/charts, signed the same way;
# - the air-gapped bundle (amd64, with the CLI wheels);
# - a GitHub release with all of it and SHA256SUMS.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no leading v), for a dry run without publishing"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # A tag publishes; a manual run builds everything and publishes nothing.
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
  # The image builds would otherwise upload *.dockerbuild build records as
  # artifacts; nothing uses them and they are not release files.
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      owner: ${{ steps.v.outputs.owner }}
    steps:
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ inputs.version }}"; fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$' || { echo "bad version $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  approve:
    # The one manual gate before anything is pushed to a registry or released:
    # a tag run waits here for a reviewer of the `release` environment. A dry
    # run (workflow_dispatch) skips it and publishes nothing anyway.
    needs: version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - run: echo "Approved to publish ${{ needs.version.outputs.version }} from ${GITHUB_REF_NAME} at ${GITHUB_SHA}"

  binaries:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v4   # the arm64 bubblewrap builds in an emulated container
      - run: scripts/release-binaries.sh "${{ needs.version.outputs.version }}" "${{ matrix.arch }}" dist
      - name: The archive runs (amd64)
        if: matrix.arch == 'amd64'
        run: |
          tar -C dist -xzf dist/*.tar.gz
          dir=$(echo dist/evalsi_*_linux_amd64)
          "$dir/evalsid" version | grep -q "${{ needs.version.outputs.version }}"
          "$dir/bwrap" --version
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.arch }}
          path: dist/*.tar.gz

  python:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build
        working-directory: python
        run: |
          ../scripts/set-python-version.sh "${{ needs.version.outputs.version }}" .
          uv build --all-packages -o ../dist
      - uses: actions/upload-artifact@v7
        with:
          name: python
          path: dist/*

  wheels:
    # Platform wheels of evalsi: the pure wheel plus that architecture's
    # evalsid and static bubblewrap in evalsi/_bin (scripts/platform_wheel.py).
    # pip prefers one on a matching Linux machine; the pure wheel stays for
    # everything else.
    needs: [version, python, binaries]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: python
          path: pure
      - uses: actions/download-artifact@v8
        with:
          name: binaries-${{ matrix.arch }}
          path: archive
      - name: Build
        run: |
          python3 scripts/platform_wheel.py pure/evalsi-[0-9]*-py3-none-any.whl \
            archive/evalsi_${{ needs.version.outputs.version }}_linux_${{ matrix.arch }}.tar.gz dist
      - name: The amd64 wheel installs and its evalsid runs
        if: matrix.arch == 'amd64'
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q dist/*.whl
          /tmp/venv/bin/evalsi evalsid-path
          "$(/tmp/venv/bin/evalsi evalsid-path)" version | grep -q "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.arch }}
          path: dist/*.whl

  # PyPI allows one pending trusted publisher per repository, workflow and
  # environment, so each package publishes from its own environment:
  #   evalsi          -> environment "pypi"
  #   evalsi-harness  -> environment "pypi-harness"
  # Register each on pypi.org with that environment name (docs/RELEASING.md).
  # A PyPI version can never be uploaded again, so these wait for the
  # release approval and for every other build to succeed first.
  pypi:
    needs: [python, wheels, approve, binaries, image, collector, charts, bundle]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing; no stored token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python
          path: all
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: all
      - name: Only evalsi
        run: mkdir dist && mv all/evalsi-[0-9]* dist/ && ls dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  pypi-harness:
    needs: [python, approve, binaries, image, collector, charts, bundle]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi-harness
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python
          path: all
      - name: Only evalsi-harness
        run: mkdir dist && mv all/evalsi_harness-[0-9]* dist/ && ls dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  image:
    needs: [version, approve]
    if: ${{ !cancelled() && needs.version.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.approve.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless signing: no key to store
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.version.outputs.version }}
          push: ${{ env.PUBLISH == 'true' }}
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ needs.version.outputs.owner }}/evalsi:${{ needs.version.outputs.version }}
            ghcr.io/${{ needs.version.outputs.owner }}/evalsi:latest
      - uses: sigstore/cosign-installer@v3
        if: env.PUBLISH == 'true'
      - uses: anchore/sbom-action@v0
        if: env.PUBLISH == 'true'
        with:
          image: ghcr.io/${{ needs.version.outputs.owner }}/evalsi@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: evalsi-${{ needs.version.outputs.version }}.spdx.json
          upload-artifact: false
      - name: Sign the image and attest its SBOM
        if: env.PUBLISH == 'true'
        run: |
          ref="ghcr.io/${{ needs.version.outputs.owner }}/evalsi@${{ steps.build.outputs.digest }}"
          cosign sign --yes "$ref"
          cosign attest --yes --type spdxjson --predicate "evalsi-${{ needs.version.outputs.version }}.spdx.json" "$ref"
      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true'
        with:
          name: sbom-evalsi
          path: evalsi-*.spdx.json

  collector:
    needs: [version, approve]
    if: ${{ !cancelled() && needs.version.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.approve.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: deploy/collector/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ needs.version.outputs.owner }}/evalsi-collector:${{ needs.version.outputs.version }}
            ghcr.io/${{ needs.version.outputs.owner }}/evalsi-collector:latest
      - uses: sigstore/cosign-installer@v3
        if: env.PUBLISH == 'true'
      - name: Sign the image
        if: env.PUBLISH == 'true'
        run: cosign sign --yes "ghcr.io/${{ needs.version.outputs.owner }}/evalsi-collector@${{ steps.build.outputs.digest }}"

  charts:
    needs: [version, approve]
    if: ${{ !cancelled() && needs.version.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.approve.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.0
      - uses: sigstore/cosign-installer@v3
        if: env.PUBLISH == 'true'
      - name: Package
        run: |
          v="${{ needs.version.outputs.version }}"
          for c in evalsi-crds evalsi evalsi-sandboxd; do
            helm package "deploy/helm/$c" --version "$v" --app-version "$v" -d dist
          done
      - name: Push and sign
        # Each chart is signed by the digest `helm push` reports.
        if: env.PUBLISH == 'true'
        run: |
          owner="${{ needs.version.outputs.owner }}"
          # helm keeps its own credentials, which cosign does not read: log in
          # for both, or the signature push is refused as unauthenticated.
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          for c in dist/*.tgz; do
            name="$(basename "$c" .tgz)"; name="${name%-${{ needs.version.outputs.version }}}"
            digest="$(helm push "$c" "oci://ghcr.io/$owner/charts" 2>&1 | tee /dev/stderr | sed -n 's/^Digest: //p')"
            [ -n "$digest" ] || { echo "no digest for $c"; exit 1; }
            cosign sign --yes "ghcr.io/$owner/charts/$name@$digest"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: charts
          path: dist/*.tgz

  bundle:
    needs: [version, image]
    # `approve` is skipped on a dry run, and a skipped job anywhere up the chain
    # skips a job that has only the default condition. Run whenever the image built.
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read   # pulls the image the image job published
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.0
      - name: Image
        # The published image; on a dry run, the same Dockerfile built here.
        run: |
          v="${{ needs.version.outputs.version }}"
          img="ghcr.io/${{ needs.version.outputs.owner }}/evalsi:$v"
          if [ "$PUBLISH" != true ]; then docker build --build-arg VERSION="$v" -t "$img" .; fi
      - name: Bundle
        run: |
          v="${{ needs.version.outputs.version }}"
          export EVALSI_IMAGE_REPOSITORY="ghcr.io/${{ needs.version.outputs.owner }}/evalsi"
          [ "$PUBLISH" = true ] || export PULL=0
          scripts/set-python-version.sh "$v"
          deploy/airgap/bundle.sh --tag "$v" --out "evalsi-bundle-$v" --with-cli
          tar czf "evalsi-bundle-$v-linux-amd64.tgz" "evalsi-bundle-$v"
      - uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: evalsi-bundle-*.tgz

  release:
    needs: [version, binaries, python, wheels, image, collector, charts, bundle]
    # A dry run gathers and checksums the release files too, so that step is
    # exercised before a tag; only the GitHub release itself needs a tag.
    # `approve` is skipped on a dry run, which would skip a job that has only the
    # default condition, so the needed jobs are named instead.
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.binaries.result == 'success' && needs.python.result == 'success' && needs.wheels.result == 'success' && needs.image.result == 'success' && needs.collector.result == 'success' && needs.charts.result == 'success' && needs.bundle.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          # Only what belongs on the release. Downloading every artifact also
          # fetched the build records, which failed on the first tag run.
          pattern: "{binaries-*,python,wheels-*,charts,bundle,sbom-*}"
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        if: env.PUBLISH == 'true'
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
