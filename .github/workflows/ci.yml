name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  # No path filter on pull requests: the ruleset requires these checks, and a
  # check that never runs leaves a docs-only pull request unable to merge.
  pull_request:
  # Also how to run the heavy jobs below on a branch: Actions > ci > Run workflow.
  workflow_dispatch:
    inputs:
      cli_agent_e2e:
        description: Run a live Claude CLI on the kind pod sandbox (requires ANTHROPIC_API_KEY)
        type: boolean
        default: false
      cpu_only:
        description: Skip the provider-backed MCP check; still run CPU training and kind verification
        type: boolean
        default: false

permissions:
  contents: read

env:
  # proxy.golang.org sometimes answers a module download with a stream
  # INTERNAL_ERROR, which failed jobs before any test ran (python, e2e). The
  # "|" falls back to fetching from the module's origin on any error, not only
  # on a 404 as "," does.
  GOPROXY: https://proxy.golang.org|direct

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.73.0
          setup_only: true
      - run: buf lint
      - run: buf format --diff --exit-code
      - name: Generated code is current
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.21.0
          buf generate
          make operator-gen
          git diff --exit-code -- gen/ operator/

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Kubernetes storage backends, which the store and objstore tests
    # also run against.
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: evalsi, POSTGRES_PASSWORD: evalsi, POSTGRES_DB: evalsi}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U evalsi" --health-interval 2s --health-retries 30
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        # Connector tests create a temporary account to prove SELECT/INSERT
        # grants suffice at runtime. Only this disposable test admin needs DDL.
        env: {CLICKHOUSE_USER: evalsi, CLICKHOUSE_PASSWORD: evalsi, CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"}
        ports: ["8123:8123"]
        options: --health-cmd "clickhouse-client --user evalsi --password evalsi -q 'SELECT 1'" --health-interval 2s --health-retries 30
      minio:
        image: bitnamilegacy/minio:2025.7.23
        env: {MINIO_ROOT_USER: evalsi, MINIO_ROOT_PASSWORD: evalsi-secret}
        ports: ["9000:9000"]
        options: --health-cmd "curl -sf http://127.0.0.1:9000/minio/health/live" --health-interval 2s --health-retries 30
    env:
      EVALSI_TEST_POSTGRES_DSN: postgres://evalsi:evalsi@127.0.0.1:5432/evalsi?sslmode=disable
      EVALSI_TEST_CLICKHOUSE_URL: http://evalsi:evalsi@127.0.0.1:8123
      EVALSI_TEST_S3_ENDPOINT: 127.0.0.1:9000
      EVALSI_TEST_S3_ACCESS_KEY: evalsi
      EVALSI_TEST_S3_SECRET_KEY: evalsi-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@v3   # image signatures made by the real CLI must verify
        with:
          cosign-release: v2.6.1
      - name: Sandbox prerequisites
        # bubblewrap for the namespaced rung; Ubuntu 24.04 restricts unprivileged
        # user namespaces through AppArmor unless this is relaxed.
        # The pod rung's tests run their fake pods on the host, at the paths a
        # pod would mount.
        run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo install -d -m 1777 /workspace /work
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.0
      - name: envtest (a kube-apiserver and etcd for the operator's tests)
        run: echo "KUBEBUILDER_ASSETS=$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.2 use -p path)" >> "$GITHUB_ENV"
      - run: go vet ./...
      - run: go test -race ./...
        env:
          # Both sandbox rungs must work here; skipping them would hide regressions.
          EVALSI_REQUIRE_SANDBOX: "1"
          EVALSI_REQUIRE_HELM: "1"
      - name: Charts on Kubernetes 1.34, 1.36 and 1.37
        env:
          EVALSI_REQUIRE_HELM: "1"
        run: |
          for version in 1.34.0 1.36.0 1.37.0; do
            echo "Kubernetes capabilities: $version"
            EVALSI_TEST_KUBE_VERSION="$version" go test -count=1 ./tests/helm
          done
      - name: cgroup limits (as root, in a cgroup v2 directory with memory and pids)
        run: |
          go test -c -o "$RUNNER_TEMP/sandbox.test" ./internal/sandbox
          sudo EVALSI_REQUIRE_CGROUP=1 EVALSI_REQUIRE_SANDBOX=1 "$RUNNER_TEMP/sandbox.test" -test.run Cgroup -test.v
      - name: Static binaries
        run: make build
      - name: evalsid and the operator build on macOS
        run: GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/evalsid ./cmd/evalsi-operator

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # One version on pull requests; the full range on main.
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.11","3.12","3.13"]') }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7   # test_client_evaluate builds evalsid
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --all-packages
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest -q
        env:
          EVALSI_REQUIRE_EVALSID: "1"
      - name: Verification prerequisites and benchmark correctness controls
        run: |
          uv run --no-sync ruff check --config pyproject.toml ../tests/verification ../tests/benchmarks
          uv run --no-sync ruff format --check --config pyproject.toml ../tests/verification ../tests/benchmarks
          uv run --no-sync pytest -q ../tests/verification ../tests/benchmarks/test_evaluation.py
      - name: CLI smoke test
        run: uv run --no-sync evalsi eval --data ../examples/quickstart/qa.jsonl --evaluators exact-match,numeric-match
      - name: The RAG example gate fails on a bad citation and passes once it is fixed
        # examples/rag backs the "Evaluate a RAG pipeline" guide: no model, no judge.
        run: |
          code=0
          uv run --no-sync evalsi run -f ../examples/rag/gate.yaml || code=$?
          test "$code" -eq 3
          sed 's/\[4\]/[2]/' ../examples/rag/rag.jsonl > ../examples/rag/fixed.jsonl
          sed 's/rag.jsonl/fixed.jsonl/' ../examples/rag/gate.yaml > ../examples/rag/fixed.yaml
          uv run --no-sync evalsi run -f ../examples/rag/fixed.yaml
          rm ../examples/rag/fixed.jsonl ../examples/rag/fixed.yaml

  onboarding:
    # Test the action with published packages and a starter from this checkout.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Generate starter and lint action adapter
        working-directory: python
        run: |
          uv sync --locked --all-packages
          uv run --no-sync ruff check --config pyproject.toml ../.github/actions/evalsi/run.py
          uv run --no-sync ruff format --check --config pyproject.toml ../.github/actions/evalsi/run.py
          uv run --no-sync evalsi init ../.evalsi-action-smoke
      - name: Published packages pass the working control
        uses: ./
        with:
          spec: run.yaml
          working-directory: .evalsi-action-smoke
      - name: Published packages reject the negative control
        id: negative
        continue-on-error: true
        uses: ./
        with:
          spec: regressed.yaml
          working-directory: .evalsi-action-smoke
          install: 'false'
      - name: Assert gate failure was propagated
        if: always()
        env:
          OUTCOME: ${{ steps.negative.outcome }}
          EXIT_CODE: ${{ steps.negative.outputs.exit-code }}
        run: |
          test "$OUTCOME" = failure
          test "$EXIT_CODE" = 3

  adapters:
    # Each framework adapter has its own pinned environment, so upstream
    # dependency conflicts never reach the SDK or each other. Contract tests run
    # the real upstream package with a scripted judge or target, offline.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        adapter: [deepeval, ragas, inspect, lm-eval, swebench, bfcl]
    defaults:
      run:
        working-directory: python/adapters/${{ matrix.adapter }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest -q

  taubench:
    # tau2-bench needs Python 3.12 (its .python-version) and its data
    # directory, which is not part of the package: fetched at the pinned commit.
    # Heavy: runs on main and on demand (workflow_dispatch), not on every pull
    # request push, to save runner minutes.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python/adapters/taubench
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: tau2 data
        run: |
          git init -q "$RUNNER_TEMP/tau2"
          cd "$RUNNER_TEMP/tau2"
          git remote add origin https://github.com/sierra-research/tau2-bench
          git sparse-checkout set data
          git fetch -q --depth 1 origin f8de30c298689cbe0117d76a378e7315a17e5bd8
          git checkout -q FETCH_HEAD
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest -q
        env:
          TAU2_DATA_DIR: ${{ runner.temp }}/tau2/data

  e2e:
    # evalsid against a real Python worker, plus the Python codegen check.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: evalsi, POSTGRES_PASSWORD: evalsi, POSTGRES_DB: evalsi}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U evalsi" --health-interval 2s --health-retries 30
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env: {CLICKHOUSE_USER: evalsi, CLICKHOUSE_PASSWORD: evalsi}
        ports: ["8123:8123"]
        options: --health-cmd "clickhouse-client --user evalsi --password evalsi -q 'SELECT 1'" --health-interval 2s --health-retries 30
      minio:
        image: bitnamilegacy/minio:2025.7.23
        env: {MINIO_ROOT_USER: evalsi, MINIO_ROOT_PASSWORD: evalsi-secret}
        ports: ["9000:9000"]
        options: --health-cmd "curl -sf http://127.0.0.1:9000/minio/health/live" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v7
      - name: Sandbox prerequisites
        # bubblewrap for the namespaced rung; Ubuntu 24.04 restricts unprivileged
        # user namespaces through AppArmor unless this is relaxed.
        run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv sync --locked --all-packages
        working-directory: python
      - name: Generated Python code is current
        run: |
          scripts/gen-python-proto.sh
          git diff --exit-code -- python/evalsi/src/evalsi/v1alpha1 python/evalsi/src/evalsi/plugin \
            python/evalsi/src/evalsi/sandbox/v1alpha1 python/evalsi/src/evalsi/harness/v1alpha1
      - name: Python tests against a real sandbox
        # A static evalsid, as released: it is also the in-sandbox egress forwarder.
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/evalsid" ./cmd/evalsid
          # EVALSI_REQUIRE_SANDBOX makes the real-rung tests fail, not skip, when this
          # runner lacks the bubblewrap or Landlock rung they pin.
          cd python && EVALSI_REQUIRE_SANDBOX=1 EVALSI_TEST_EVALSID="$RUNNER_TEMP/evalsid" uv run --no-sync pytest -q
      - name: The agent-gate example passes, and a regressed agent fails its gate
        # examples/agent-gate backs the "Gate an agent in CI" guide: a stand-in
        # agent in a real sandbox, exit 0 when it fixes the tasks, 3 when not.
        run: |
          export PATH="$RUNNER_TEMP:$PATH"
          cd python
          uv run --no-sync evalsi run -f ../examples/agent-gate/run.yaml
          sed 's/return a \* b/return a + b/' ../examples/agent-gate/run.yaml > ../examples/agent-gate/regressed.yaml
          code=0
          uv run --no-sync evalsi run -f ../examples/agent-gate/regressed.yaml || code=$?
          rm ../examples/agent-gate/regressed.yaml
          test "$code" -eq 3
      - name: The support-refund example passes, and a regressed agent fails its gates
        # examples/support-refund backs the support and refund starter guide: a
        # stand-in agent on a simulated shop, graded on its final state by a
        # clean-isolation checker. The generated files must be current.
        run: |
          export PATH="$RUNNER_TEMP:$PATH"
          python3 examples/support-refund/build.py --check
          cd python
          uv run --no-sync evalsi run -f ../examples/support-refund/run.yaml
          sed 's/agent.py, careful/agent.py, sloppy/' ../examples/support-refund/run.yaml > ../examples/support-refund/regressed.yaml
          code=0
          uv run --no-sync evalsi run -f ../examples/support-refund/regressed.yaml || code=$?
          rm ../examples/support-refund/regressed.yaml
          test "$code" -eq 3
      - run: uv sync --locked
        working-directory: python/adapters/swebench
      - name: End-to-end tests
        # Includes the Phase 3 exit criterion at fixture scale (a CLI agent on
        # SWE-bench instances, graded by the swebench package) and Harbor and
        # Terminal-Bench tasks on a pulled image.
        run: go test -count=1 -v ./tests/e2e/
        env:
          EVALSI_E2E_WORKER: ${{ github.workspace }}/python/.venv/bin/python -m evalsi
          EVALSI_E2E_SWEBENCH_WORKER: ${{ github.workspace }}/python/adapters/swebench/.venv/bin/python -m evalsi
          EVALSI_E2E_IMAGES: "1"
          EVALSI_E2E_POSTGRES_DSN: postgres://evalsi:evalsi@127.0.0.1:5432/evalsi?sslmode=disable
          EVALSI_E2E_CLICKHOUSE_URL: http://evalsi:evalsi@127.0.0.1:8123
          EVALSI_E2E_S3_ENDPOINT: 127.0.0.1:9000
          EVALSI_E2E_S3_ACCESS_KEY: evalsi
          EVALSI_E2E_S3_SECRET_KEY: evalsi-secret

  checkpoint-hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        framework: [pytorch, lightning]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Isolated CPU framework environment
        run: |
          uv venv -p 3.11 "$RUNNER_TEMP/checkpoints"
          uv pip install --python "$RUNNER_TEMP/checkpoints/bin/python" torch==2.14.1 pytest==9.1.1 -e python/evalsi
          if [ '${{ matrix.framework }}' = lightning ]; then
            uv pip install --python "$RUNNER_TEMP/checkpoints/bin/python" lightning==2.6.6
          else
            uv pip install --python "$RUNNER_TEMP/checkpoints/bin/python" pandas==2.3.3 datasets==4.4.2
          fi
      - name: Real checkpoint and tensor logging tests
        run: |
          "$RUNNER_TEMP/checkpoints/bin/python" -m pytest -q \
            tests/training_hooks/test_checkpoint_hooks.py::test_real_${{ matrix.framework }}_checkpoint_hook \
            tests/training_hooks/test_checkpoint_hooks.py::test_real_tensor_logging
          if [ '${{ matrix.framework }}' = pytorch ]; then
            "$RUNNER_TEMP/checkpoints/bin/python" -m pytest -q tests/training_hooks/test_checkpoint_hooks.py::test_real_pandas_and_huggingface_batches
          fi

  dsh-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/demo/dsh/plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/demo/dsh/plugin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=moderate

  ui-browser:
    # The web UI in a real Chromium, served by a real evalsid: the script runs
    # under the Content-Security-Policy, every section renders, and sign-in works.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json
      - run: uv sync --locked --all-packages
        working-directory: python
      - run: npm ci
        working-directory: tests/ui
      - run: npx playwright-core install --with-deps chromium
        working-directory: tests/ui
      - run: npm test
        working-directory: tests/ui
        env:
          EVALSI_UI_WORKER: ${{ github.workspace }}/python/.venv/bin/python -m evalsi

  trainers:
    # Phase 5's exit criterion at CPU scale: TRL GRPO trains a tiny model
    # with Evals.si code rewards run in the real sandbox, and the
    # TrainerCallback evaluates every checkpoint.
    # Heavy: runs on main and on demand (workflow_dispatch), not on every pull
    # request push, to save runner minutes.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v7
      - name: Sandbox prerequisites
        run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Trainer environment
        run: |
          uv venv -p 3.12 "$RUNNER_TEMP/trainers"
          export VIRTUAL_ENV="$RUNNER_TEMP/trainers"
          uv pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install -r tests/trainers/requirements.txt -e python/evalsi
      - name: GRPO with Evals.si rewards
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/evalsid" ./cmd/evalsid
          cd tests/trainers && EVALSID="$RUNNER_TEMP/evalsid" "$RUNNER_TEMP/trainers/bin/python" -m pytest -q

  rlframeworks:
    # Evals.si rewards inside verl and OpenRLHF themselves: verl's reward
    # managers load the reward through custom_reward_function, and OpenRLHF's
    # rollout executor calls it as a --remote_rm_url file and over HTTP. No
    # training (that needs GPUs); everything from a finished rollout to the
    # reward tensor is the frameworks' own code.
    # Heavy: runs on main and on demand (workflow_dispatch), not on every pull
    # request push, to save runner minutes.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Framework environment
        run: |
          uv venv -p 3.12 "$RUNNER_TEMP/rl"
          export VIRTUAL_ENV="$RUNNER_TEMP/rl"
          uv pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install -r tests/rlframeworks/requirements.txt -e python/evalsi
          uv pip install --no-deps openrlhf==0.11.2
      - name: verl and OpenRLHF with Evals.si rewards
        run: cd tests/rlframeworks && "$RUNNER_TEMP/rl/bin/python" -m pytest -q

  envspecs:
    # The task environments as OpenEnv, verifiers, Gymnasium and NeMo Gym environments, against the
    # real packages at the versions the adapters were written for (each has
    # its own dependency tree, so each gets its own environment).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: OpenEnv
        run: |
          uv venv -p 3.12 "$RUNNER_TEMP/openenv"
          grep -E '^(openenv-core|pytest)==' tests/envspecs/requirements.txt \
            | VIRTUAL_ENV="$RUNNER_TEMP/openenv" uv pip install -r - -e python/evalsi -e python/evalsi-harness
          cd tests/envspecs && "$RUNNER_TEMP/openenv/bin/python" -m pytest -q test_openenv.py
      - name: verifiers
        run: |
          uv venv -p 3.12 "$RUNNER_TEMP/verifiers"
          grep -E '^(verifiers|pytest)==' tests/envspecs/requirements.txt \
            | VIRTUAL_ENV="$RUNNER_TEMP/verifiers" uv pip install -r - -e python/evalsi -e python/evalsi-harness
          cd tests/envspecs && "$RUNNER_TEMP/verifiers/bin/python" -m pytest -q test_verifiers.py
      - name: Gymnasium
        run: |
          uv venv -p 3.12 "$RUNNER_TEMP/gymnasium"
          grep -E '^(gymnasium|pytest)==' tests/envspecs/requirements.txt \
            | VIRTUAL_ENV="$RUNNER_TEMP/gymnasium" uv pip install -r - -e python/evalsi -e python/evalsi-harness
          cd tests/envspecs && "$RUNNER_TEMP/gymnasium/bin/python" -m pytest -q test_gymnasium.py
      - name: NeMo Gym
        # nemo-gym 0.7 needs Python 3.13.14 or newer.
        run: |
          uv venv -p 3.13 "$RUNNER_TEMP/nemogym"
          grep -E '^(nemo-gym|pytest|pytest-asyncio)==' tests/envspecs/requirements.txt \
            | VIRTUAL_ENV="$RUNNER_TEMP/nemogym" uv pip install -r - -e python/evalsi -e python/evalsi-harness
          cd tests/envspecs && "$RUNNER_TEMP/nemogym/bin/python" -m pytest -q test_nemogym.py

  mcp-agent:
    # Phase 6's exit test with a real coding agent: Claude Code, headless,
    # drives `evalsi mcp` to run a spec, and the job checks the tool call, the
    # results file and the reported score (tests/mcp-agent/run.sh). It calls a
    # model, so it runs on main and on demand, and only when the repository has
    # an ANTHROPIC_API_KEY secret; without one it says so and passes.
    if: github.event_name != 'pull_request' && !inputs.cpu_only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - if: env.ANTHROPIC_API_KEY == ''
        run: 'echo "::notice::mcp-agent skipped, the repository has no ANTHROPIC_API_KEY secret"'
      - if: env.ANTHROPIC_API_KEY != ''
        uses: actions/checkout@v7
      - if: env.ANTHROPIC_API_KEY != ''
        uses: astral-sh/setup-uv@v7
      - if: env.ANTHROPIC_API_KEY != ''
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - if: env.ANTHROPIC_API_KEY != ''
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - if: env.ANTHROPIC_API_KEY != ''
        run: cd python && uv sync --all-packages
      - if: env.ANTHROPIC_API_KEY != ''
        run: tests/mcp-agent/run.sh

  collector-image:
    # The release builds this image; build it here so a Dockerfile or
    # .dockerignore mistake fails a pull request, not the release.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --load -f deploy/collector/Dockerfile -t evalsi-collector:ci .
      - name: The image carries its configs
        run: |
          docker create --name collector-ci evalsi-collector:ci
          docker cp collector-ci:/etc/evalsi-collector/config.yaml - >/dev/null
          docker cp collector-ci:/etc/evalsi-collector/config-dev.yaml - >/dev/null

  release-check:
    # The release archive builds (static Go binaries and a static
    # bubblewrap) and runs, so a tag cannot find it broken.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/release-binaries.sh 0.0.0-ci amd64 dist
      - name: The archive runs, and evalsid uses its bubblewrap
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          tar -C dist -xzf dist/evalsi_0.0.0-ci_linux_amd64.tar.gz
          dir=dist/evalsi_0.0.0-ci_linux_amd64
          "$dir/evalsid" version | grep -q 0.0.0-ci
          echo '{"command":["/bin/sh","-c","echo ok"],"min_isolation":"namespaced","timeout_s":10}' \
            | PATH=/nonexistent "$dir/evalsid" sandbox run | tee /dev/stderr | grep -q '"outcome":"exit"'
      - uses: astral-sh/setup-uv@v7
      - name: A platform wheel bundles it, and an install of it finds and runs it
        run: |
          # The tag form 0.0.0-rc1 builds the PEP 440 wheel 0.0.0rc1.
          scripts/set-python-version.sh 0.0.0-rc1 python
          (cd python && uv build --package evalsi --wheel -o ../wheels)
          cp dist/evalsi_0.0.0-ci_linux_amd64.tar.gz dist/evalsi_0.0.0-rc1_linux_amd64.tar.gz
          python3 scripts/platform_wheel.py wheels/evalsi-0.0.0rc1-py3-none-any.whl \
            dist/evalsi_0.0.0-rc1_linux_amd64.tar.gz wheels
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q wheels/*manylinux*.whl
          bin=$(PATH=/nonexistent /tmp/venv/bin/evalsi evalsid-path)
          case "$bin" in */evalsi/_bin/evalsid) ;; *) echo "not the bundled evalsid: $bin"; exit 1;; esac
          "$bin" version | grep -q 0.0.0-ci
          # Its sandbox uses the bwrap beside it, with nothing on PATH.
          echo '{"command":["/bin/sh","-c","echo ok"],"min_isolation":"namespaced","timeout_s":10}' \
            | PATH=/nonexistent "$bin" sandbox run | grep -q '"outcome":"exit"'
      - name: The PyPI pages render (README and metadata of both packages)
        run: |
          (cd python && uv build --all-packages -o ../pypi-dist)
          uvx twine==7.0.0 check --strict pypi-dist/*

  kubernetes:
    # Phase 4's exit criteria on a kind cluster: an air-gapped install from
    # the bundle (two API replicas on PostgreSQL, NATS, workers, the operator,
    # evalsi-sandboxd), kubectl-apply parity with `evalsi run -f`, the
    # webhooks, and the bubblewrap and pod sandbox rungs.
    # Heavy: runs on main and on demand (workflow_dispatch), not on every pull
    # request push, to save runner minutes.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The image, the bundle and two kind nodes' copies of every image do
      # not fit next to the runner's preinstalled toolchains.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker image prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v7
      - name: Validate live CLI opt-in
        if: inputs.cli_agent_e2e && !inputs.cpu_only
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: 'test -n "$ANTHROPIC_API_KEY" || { echo "::error::cli_agent_e2e requires ANTHROPIC_API_KEY"; exit 1; }'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v7
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.0
      - name: kind
        run: go install sigs.k8s.io/kind@v0.33.0
      - run: uv sync --locked --all-packages
        working-directory: python
      - name: Kubernetes end-to-end
        env:
          RUN_CLI_AGENT_E2E: ${{ inputs.cli_agent_e2e && !inputs.cpu_only && '1' || '0' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVALSI_CLI_AGENT_ARTIFACTS: ${{ runner.temp }}/cli-agent-e2e
        run: deploy/e2e/kind-e2e.sh
      - name: Live CLI results
        if: always() && inputs.cli_agent_e2e && !inputs.cpu_only
        uses: actions/upload-artifact@v7
        with:
          name: cli-agent-e2e
          path: ${{ runner.temp }}/cli-agent-e2e/results.json
          if-no-files-found: warn

  service-environments:
    # Uses a CNI that enforces NetworkPolicy; kind's default CNI cannot prove isolation.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v7
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.33.0
      - name: Service lifecycle and trial isolation
        run: deploy/e2e/services-kind.sh --report "$RUNNER_TEMP/service-results.json"
      - name: Service verification results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: service-verification
          path: ${{ runner.temp }}/service-results.json
          if-no-files-found: warn
