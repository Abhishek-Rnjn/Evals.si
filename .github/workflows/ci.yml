name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.73.0
          setup_only: true
      - run: buf lint
      - run: buf format --diff --exit-code
      - name: Generated code is current
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.21.0
          buf generate
          git diff --exit-code -- gen/

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Sandbox prerequisites
        # bubblewrap for the namespaced rung; Ubuntu 24.04 restricts unprivileged
        # user namespaces through AppArmor unless this is relaxed.
        run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go test -race ./...
        env:
          # Both sandbox rungs must work here; skipping them would hide regressions.
          EVALSI_REQUIRE_SANDBOX: "1"
      - name: Static binaries
        run: make build

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --all-packages
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest -q
      - name: CLI smoke test
        run: uv run --no-sync evalsi eval --data ../examples/quickstart/qa.jsonl --evaluators exact-match,numeric-match

  adapters:
    # Each framework adapter has its own pinned environment, so upstream
    # dependency conflicts never reach the SDK or each other. Contract tests run
    # the real upstream package with a scripted judge or target, offline.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [deepeval, ragas, inspect, lm-eval, swebench, bfcl]
    defaults:
      run:
        working-directory: python/adapters/${{ matrix.adapter }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest -q

  taubench:
    # tau2-bench needs Python 3.12 (its .python-version) and its data
    # directory, which is not part of the package: fetched at the pinned commit.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/adapters/taubench
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: tau2 data
        run: |
          git init -q "$RUNNER_TEMP/tau2"
          cd "$RUNNER_TEMP/tau2"
          git remote add origin https://github.com/sierra-research/tau2-bench
          git sparse-checkout set data
          git fetch -q --depth 1 origin f8de30c298689cbe0117d76a378e7315a17e5bd8
          git checkout -q FETCH_HEAD
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest -q
        env:
          TAU2_DATA_DIR: ${{ runner.temp }}/tau2/data

  e2e:
    # evalsid against a real Python worker, plus the Python codegen check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v7
      - name: Sandbox prerequisites
        # bubblewrap for the namespaced rung; Ubuntu 24.04 restricts unprivileged
        # user namespaces through AppArmor unless this is relaxed.
        run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv sync --locked --all-packages
        working-directory: python
      - name: Generated Python code is current
        run: |
          scripts/gen-python-proto.sh
          git diff --exit-code -- python/evalsi/src/evalsi/v1alpha1 python/evalsi/src/evalsi/plugin \
            python/evalsi/src/evalsi/sandbox/v1alpha1 python/evalsi/src/evalsi/harness/v1alpha1
      - name: Python tests against a real sandbox
        # A static evalsid, as released: it is also the in-sandbox egress forwarder.
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/evalsid" ./cmd/evalsid
          cd python && EVALSI_TEST_EVALSID="$RUNNER_TEMP/evalsid" uv run --no-sync pytest -q
      - run: uv sync --locked
        working-directory: python/adapters/swebench
      - name: End-to-end tests
        # Includes the Phase 3 exit criterion at fixture scale (a CLI agent on
        # SWE-bench instances, graded by the swebench package) and Harbor and
        # Terminal-Bench tasks on a pulled image.
        run: go test -count=1 -v ./tests/e2e/
        env:
          EVALSI_E2E_WORKER: ${{ github.workspace }}/python/.venv/bin/python -m evalsi
          EVALSI_E2E_SWEBENCH_WORKER: ${{ github.workspace }}/python/adapters/swebench/.venv/bin/python -m evalsi
          EVALSI_E2E_IMAGES: "1"
