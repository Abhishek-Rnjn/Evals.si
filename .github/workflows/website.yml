name: website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/**
      - examples/**
      - README.md
      - CHANGELOG.md
      - .github/workflows/website.yml
  pull_request:
    paths:
      - website/**
      - docs/**
      - examples/**
      - README.md
      - CHANGELOG.md
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Google Search Console's verification tag; empty adds no tag.
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      - run: node scripts/check-links.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
