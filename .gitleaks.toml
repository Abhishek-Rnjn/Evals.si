# Secret scanning (see .github/workflows/hygiene.yml). The default rules apply;
# only these exact fake values, used by the guardrail and redaction tests and
# the docs that show them, are allowed. A real credential still fails.
title = "Evalsi"

[extend]
useDefault = true

[allowlist]
description = "Fake credentials in tests and docs"
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',   # AWS's documented example access key
  '''AKIAABCDEFGHIJKLMNOP''',   # an obviously fake key in the guardrail tests
  '''whsec_0123456789abcdef''', # a fake webhook secret in the webhook tests
  '''SYNTHETIC-RUBRIC-MARKER-7f3a''', # a fake marker in the LAB/JobBench loader tests
  '''AIzaSyA-abcdefghijklmnopqrstuvwxyz01234''', # a fake Google API key in the secret-leak evaluator test
]
