# Offline fixture agent; replace target.agent to evaluate your own agent.
apiVersion: evals.si/v1alpha1
kind: EvalRun
metadata:
  name: multi-service
spec:
  target:
    agent:
      cli:
        command:
        - python
        - -c
        - "import socket\nwith socket.create_connection((\"db\", 6379), timeout=2) as s:\n \
          \   s.sendall(b\"SET answer 42\\r\\n\")\n    assert s.recv(1024) == b\"+OK\\r\\n\"\
          \nprint(\"Set the answer to 42\")\n"
  environment:
    image: python:3.13-slim
    sandbox:
      network: deny
      min_isolation: namespaced
    service_lifetime: 600s
    services:
    - name: api
      image: python:3.13-slim
      command:
      - python
      - -u
      - -c
      - "from http.server import BaseHTTPRequestHandler, HTTPServer\nimport socket\nclass Handler(BaseHTTPRequestHandler):\n\
        \    def do_GET(self):\n        with socket.create_connection((\"db\", 6379), timeout=2)\
        \ as s:\n            s.sendall(b\"GET answer\\r\\n\")\n            data = s.recv(1024).split(b\"\
        \\r\\n\")\n        value = data[1] if len(data) > 1 and data[0] != b\"$-1\" else b\"\
        unset\"\n        self.send_response(200)\n        self.end_headers()\n        self.wfile.write(value)\n\
        HTTPServer((\"0.0.0.0\", 8080), Handler).serve_forever()\n"
      port: 8080
      depends_on:
      - db
      memory_mb: 64
      cpu_millis: 100
    - name: db
      image: redis:7-alpine
      command:
      - redis-server
      - --save
      - ''
      - --appendonly
      - 'no'
      port: 6379
      memory_mb: 64
      cpu_millis: 100
    checker:
      command:
      - python
      - -c
      - 'import urllib.request

        assert urllib.request.urlopen("http://api:8080", timeout=3).read() == b"42"

        '
  dataset:
    inline:
      records:
      - id: set-answer
        input:
          text: Set the answer in the database to 42. The API must return 42.
  evaluators:
  - ref: task-success
