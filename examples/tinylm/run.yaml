# The built-in agent harness driving TinyLM, a fake model, on three sandboxed
# bug-fix tasks. Offline, free and deterministic. Start the model first:
#   python3 tinylm.py --port 8765 &
#   evalsi run -f run.yaml
# Swap the persona to see a different agent: model: tinylm-lazy, tinylm-looper, ...
# The walkthrough is docs/tutorials/03-built-in-harness.md.
apiVersion: evals.si/v1alpha1
kind: EvalRun
metadata: {name: tinylm-good}
spec:
  target:
    connector: openai-compatible
    model: tinylm-good
    base_url: http://127.0.0.1:8765/v1
    stream: true                         # token-by-token, like a real provider
  dataset: {path: tasks.jsonl}           # one task per line; each brings its own files and checker
  harness:
    builtin:
      max_steps: 12
      budget: {tokens: 200000, wall_clock: 2m}
      pricing: {input_per_mtok: 1, output_per_mtok: 4}   # pretend prices, so cost shows up
  environment:
    setup:
      - git init -q && git add -A && git -c user.email=e@x -c user.name=e commit -qm base
    sandbox: {min_isolation: namespaced, network: deny}
  evaluators:
    - ref: task-success                  # the hidden checker's verdict
    - ref: run-completed                 # stopped on its own, not on max_steps or budget
    - ref: tool-errors                   # share of tool calls that did not error
    - ref: loop-detection                # no repeated identical calls
    - ref: agent-efficiency              # steps, tokens, dollars
    - ref: policy-violations             # denied egress, escalation requests
  gates:
    - {metric: task-success, min: 1.0}
    - {metric: run-completed, min: 1.0}
    - {metric: task-success, stat: GATE_STAT_ERROR_RATE, max: 0.0}
