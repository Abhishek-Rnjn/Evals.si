# UNVERIFIED: written from Harness²'s OpenCode run argument list and this repo's
# run-spec schema. It has not been run against a live OpenCode CLI or model.
# Measured only that OpenCode 1.19.3 honours the proxy variables
# (scripts/probe-cli-proxy.py). It also needs models.opencode.ai:443 and, to install
# its provider package at run time, registry.npmjs.org:443: with only the model host
# allowed it will not start. Add them below or pre-seed both in the image.
#
# The OpenCode CLI as a bring-your-own CLI agent inside the task's sandbox, with a
# per-host network allowlist. `--format json` with `output_format: opencode-json`
# reads OpenCode's run events into model-call and tool-call steps with tokens
# and cost, so tool-errors and loop-detection have a trajectory to score. The
# reader was checked against a recorded opencode 1.19.3 stream driven by a
# scripted model server, not a live model.
#
# Fill in before running: REPLACE_WITH_PINNED_VERSION, the model (provider/model),
# the model host in allow_hosts, OPENCODE_API_KEY on the worker, and the dataset.
apiVersion: evals.si/v1alpha1
kind: EvalRun
metadata:
  name: harness2-opencode-sandboxed
spec:
  target:
    agent:
      cli:
        # `env` carries the CLI's own settings in the command. A Harbor task always
        # supplies its own environment variables, which replace the spec's
        # `environment.env` entirely, so settings put there would never arrive.
        command:
          - env
          - HOME=/tmp/agent-home
          # The file-access fence from Harness²'s reference OpenCode environment:
          # without it the session auto-rejects reads of its own working tree. The
          # workdir must match the task's workdir (/app for Harbor tasks).
          - 'OPENCODE_PERMISSION={"external_directory": {"*": "deny", "/app": "allow", "/app/**": "allow"}}'
          - opencode
          - run
          - "{instruction}"
          - --model
          - REPLACE_WITH_PROVIDER/MODEL
          - --format
          - json
        output_format: opencode-json
        install:
          - npm install -g opencode-ai@REPLACE_WITH_PINNED_VERSION
        # The variable name your provider reads (for example ANTHROPIC_API_KEY).
        env_from: {ANTHROPIC_API_KEY: HARNESS2_OPENCODE_API_KEY}
        allow_hosts: ["api.anthropic.com:443"]
        timeout: 30m
  dataset:
    # network=deny matters: a Harbor task defaults to network allow, and that
    # record-level setting would override the allowlist below.
    uri: "harbor://./workbuddy-bench/wb-bench-code-v1.0/tasks?reward=score.json&network=deny&tasks=REPLACE_WITH_TASK"
  environment:
    setup_network: allow
    sandbox:
      network: allowlist
      allow_hosts: ["api.anthropic.com:443"]
      min_isolation: namespaced
      memory_mb: 4096
  evaluators:
    - ref: task-success
    - ref: policy-violations
    - ref: agent-efficiency
  trials: 1
