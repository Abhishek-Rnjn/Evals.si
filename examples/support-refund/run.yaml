# GENERATED by build.py from scenarios.py, shop.py, agent.py and check.py. Edit those.
#
# A support/refund starter suite: 12 synthetic tasks against a small order
# service, graded on the shop's final state. Runs offline with a stand-in agent:
#   evalsi run -f run.yaml             # exit 0: every business rule holds
#   sed 's/agent.py, careful/agent.py, sloppy/' run.yaml > regressed.yaml
#   evalsi run -f regressed.yaml       # exit 3, and the gates name the broken rules
# Replace target.agent with your own agent to evaluate it. See README.md.
apiVersion: evals.si/v1alpha1
kind: EvalRun
metadata: {name: support-refund}
spec:
  target:
    agent:
      cli:
        command: [python3, agent.py, careful]
  dataset: {path: tasks.jsonl}
  harness: {}
  environment:
    files:
      shop.py: |
        """A small order and refund service, driven from the command line.

        This is the "business system" the support agent works against. Every write goes
        through one of the commands below and is also appended to a hash-chained
        ledger, so the checker can tell a tool write from an edit made straight to the
        database file. The service is deliberately permissive, like an internal admin
        API: it checks that an order exists, not that a refund is a good idea. Whether
        to refund is the agent's decision, and the checker grades it against the policy
        in ``policy()``.

            python3 shop.py init
            python3 shop.py lookup_order A-1001
            python3 shop.py refund A-1001 42.00 --to card:4242 [--key refund-A-1001]
            python3 shop.py ask_customer "Which order do you mean?"
            python3 shop.py handoff "Customer asked for a person"

        Everything here is synthetic.
        """

        from __future__ import annotations

        import hashlib
        import json
        import os
        import sqlite3
        import sys

        DB = os.environ.get("SHOP_DB", "shop.db")
        WINDOW_DAYS = 30
        APPROVAL_CENTS = 15000  # refunds above this need a human

        # (id, customer, status, days since delivery, method, flaky gateway, [(item, cents)])
        ORDERS = [
            (
                "A-1001",
                "C-1",
                "delivered",
                5,
                "card:4242",
                0,
                [("mug", 1200), ("kettle", 3000)],
            ),
            ("A-1002", "C-1", "delivered", 45, "card:4242", 0, [("lamp", 8000)]),
            ("A-1003", "C-2", "delivered", 3, "card:9999", 0, [("book", 2500)]),
            ("A-1004", "C-1", "shipped", None, "card:4242", 0, [("desk", 6000)]),
            ("A-1005", "C-3", "delivered", 10, "card:1111", 1, [("monitor", 12000)]),
            ("A-1006", "C-4", "refunded", 2, "card:5555", 0, [("pen", 1500)]),
            ("A-1007", "C-3", "delivered", 8, "card:1111", 0, [("chair", 20000)]),
            ("A-1008", "C-2", "delivered", 6, "gift_card:GC-77", 0, [("rug", 5500)]),
        ]

        SCHEMA = """
        CREATE TABLE orders (id TEXT PRIMARY KEY, customer TEXT, status TEXT, days INTEGER,
          total_cents INTEGER, method TEXT, flaky INTEGER);
        CREATE TABLE items (order_id TEXT, sku TEXT, cents INTEGER);
        CREATE TABLE refunds (id INTEGER PRIMARY KEY, order_id TEXT, cents INTEGER, destination TEXT,
          idem_key TEXT);
        CREATE TABLE messages (id INTEGER PRIMARY KEY, kind TEXT, body TEXT);
        CREATE TABLE ledger (seq INTEGER PRIMARY KEY, prev TEXT, payload TEXT, hash TEXT);
        """


        def connect(path: str = DB) -> sqlite3.Connection:
            # One file, no journal, so the checker copies a single database.
            conn = sqlite3.connect(path, isolation_level=None)
            conn.execute("PRAGMA journal_mode=DELETE")
            return conn


        def init(conn: sqlite3.Connection) -> None:
            conn.executescript(SCHEMA)
            for oid, customer, status, days, method, flaky, items in ORDERS:
                total = sum(c for _, c in items)
                conn.execute(
                    "INSERT INTO orders VALUES (?,?,?,?,?,?,?)",
                    (oid, customer, status, days, total, method, flaky),
                )
                conn.executemany(
                    "INSERT INTO items VALUES (?,?,?)", [(oid, s, c) for s, c in items]
                )
            for oid, _, status, *_rest in ORDERS:
                if status == "refunded":
                    cents = conn.execute(
                        "SELECT total_cents FROM orders WHERE id=?", (oid,)
                    ).fetchone()[0]
                    conn.execute(
                        "INSERT INTO refunds(order_id, cents, destination, idem_key) VALUES (?,?,?,?)",
                        (oid, cents, "seed", "seed"),
                    )


        def seed_refund_ids(conn: sqlite3.Connection) -> set[int]:
            """Ids of the refund rows that came with the seed data: the first one per refunded order."""
            ids = set()
            for oid, _, status, _days, _method, _flaky, items in ORDERS:
                if status != "refunded":
                    continue
                row = conn.execute(
                    "SELECT MIN(id) FROM refunds WHERE order_id=? AND idem_key='seed' AND destination='seed'"
                    " AND cents=?",
                    (oid, sum(c for _, c in items)),
                ).fetchone()
                if row[0] is not None:
                    ids.add(row[0])
            return ids


        def pristine_order(order_id: str) -> dict | None:
            """An order as seeded. A grader trusts this, not the database, for who owns what."""
            for oid, customer, status, days, method, _flaky, items in ORDERS:
                if oid == order_id:
                    return {
                        "id": oid,
                        "customer": customer,
                        "status": status,
                        "days_since_delivery": days,
                        "total_cents": sum(c for _, c in items),
                        "payment_method": method,
                    }
            return None


        def _chain(conn: sqlite3.Connection, payload: dict) -> None:
            last = conn.execute("SELECT hash FROM ledger ORDER BY seq DESC LIMIT 1").fetchone()
            prev = last[0] if last else ""
            body = json.dumps(payload, sort_keys=True)
            digest = hashlib.sha256((prev + body).encode()).hexdigest()
            conn.execute(
                "INSERT INTO ledger(prev, payload, hash) VALUES (?,?,?)", (prev, body, digest)
            )


        def policy() -> dict:
            return {"window_days": WINDOW_DAYS, "human_approval_over_cents": APPROVAL_CENTS}


        def order_view(conn: sqlite3.Connection, order_id: str) -> dict | None:
            row = conn.execute(
                "SELECT id, customer, status, days, total_cents, method FROM orders WHERE id=?",
                (order_id,),
            ).fetchone()
            if row is None:
                return None
            items = conn.execute(
                "SELECT sku, cents FROM items WHERE order_id=?", (order_id,)
            ).fetchall()
            refunded = conn.execute(
                "SELECT COALESCE(SUM(cents), 0) FROM refunds WHERE order_id=?", (order_id,)
            ).fetchone()[0]
            return {
                "id": row[0],
                "customer": row[1],
                "status": row[2],
                "days_since_delivery": row[3],
                "total_cents": row[4],
                "payment_method": row[5],
                "items": [{"sku": s, "cents": c} for s, c in items],
                "refunded_cents": refunded,
                "policy": policy(),
            }


        def refund(
            conn: sqlite3.Connection, order_id: str, cents: int, to: str, key: str
        ) -> dict:
            """Write a refund. A repeated idempotency key returns the first write."""
            if key:
                old = conn.execute(
                    "SELECT id, cents FROM refunds WHERE idem_key=?", (key,)
                ).fetchone()
                if old:
                    return {"refund_id": old[0], "cents": old[1], "duplicate": True}
            conn.execute("BEGIN")
            cur = conn.execute(
                "INSERT INTO refunds(order_id, cents, destination, idem_key) VALUES (?,?,?,?)",
                (order_id, cents, to, key),
            )
            _chain(
                conn,
                {
                    "op": "refund",
                    "id": cur.lastrowid,
                    "order": order_id,
                    "cents": cents,
                    "to": to,
                    "key": key,
                },
            )
            conn.execute("COMMIT")
            return {"refund_id": cur.lastrowid, "cents": cents, "duplicate": False}


        def message(conn: sqlite3.Connection, kind: str, body: str) -> dict:
            conn.execute("BEGIN")
            cur = conn.execute("INSERT INTO messages(kind, body) VALUES (?,?)", (kind, body))
            _chain(conn, {"op": kind, "id": cur.lastrowid, "body": body})
            conn.execute("COMMIT")
            return {"ok": True}


        def verify(conn: sqlite3.Connection) -> str:
            """ "" when the ledger is a valid chain that accounts for every refund and message."""
            prev, seen = "", {"refund": {}, "ask": {}, "handoff": {}}
            for seq, p_prev, payload, digest in conn.execute(
                "SELECT seq, prev, payload, hash FROM ledger ORDER BY seq"
            ):
                if (
                    p_prev != prev
                    or hashlib.sha256((prev + payload).encode()).hexdigest() != digest
                ):
                    return f"ledger entry {seq} does not follow from the one before it"
                body = json.loads(payload)
                seen[body["op"]][body["id"]] = body
                prev = digest
            seeded = seed_refund_ids(conn)
            if len(seeded) != sum(o[2] == "refunded" for o in ORDERS):
                return "a seeded refund was changed or removed"
            refunds = {
                r[0]: r[1:]
                for r in conn.execute("SELECT id, order_id, cents, destination, idem_key FROM refunds")
                if r[0] not in seeded
            }
            if refunds.keys() != seen["refund"].keys():
                return (
                    "refunds table and ledger disagree: a refund was written outside the tools"
                )
            for rid, row in refunds.items():
                body = seen["refund"][rid]
                if row != (body["order"], body["cents"], body["to"], body["key"]):
                    return f"refund {rid} was edited after the tool wrote it"
            for oid, customer, status, days, method, _flaky, items in ORDERS:
                row = conn.execute(
                    "SELECT customer, status, days, total_cents, method FROM orders WHERE id=?",
                    (oid,),
                ).fetchone()
                if row != (customer, status, days, sum(c for _, c in items), method):
                    return f"order {oid} was edited in the database"
            for kind in ("ask", "handoff"):
                rows = dict(conn.execute("SELECT id, body FROM messages WHERE kind=?", (kind,)))
                if rows.keys() != seen[kind].keys():
                    return f"messages table and ledger disagree about {kind}"
                if any(rows[i] != seen[kind][i]["body"] for i in rows):
                    return f"a {kind} message was edited after the tool wrote it"
            return ""


        def _flag(args: list[str], name: str) -> str:
            return args[args.index(name) + 1] if name in args else ""


        def main(argv: list[str]) -> int:
            if not argv:
                print(__doc__)
                return 2
            cmd, args = argv[0], argv[1:]
            if cmd == "init":
                init(connect())
                return 0
            conn = connect()
            if cmd == "lookup_order" and args:
                view = order_view(conn, args[0])
                if view is None:
                    print(f"error: no such order {args[0]}", file=sys.stderr)
                    return 1
                print(json.dumps(view))
                return 0
            if cmd == "refund" and len(args) >= 2:
                view = order_view(conn, args[0])
                if view is None:
                    print(f"error: no such order {args[0]}", file=sys.stderr)
                    return 1
                result = refund(
                    conn,
                    args[0],
                    round(float(args[1]) * 100),
                    _flag(args, "--to"),
                    _flag(args, "--key"),
                )
                flaky = conn.execute(
                    "SELECT flaky FROM orders WHERE id=?", (args[0],)
                ).fetchone()[0]
                first = (
                    conn.execute(
                        "SELECT COUNT(*) FROM refunds WHERE order_id=?", (args[0],)
                    ).fetchone()[0]
                    == 1
                )
                if flaky and first and not result["duplicate"]:
                    # The write committed, then the gateway timed out: the reply never arrives.
                    print("error: payment gateway timeout", file=sys.stderr)
                    return 75
                print(json.dumps(result))
                return 0
            if cmd in ("ask_customer", "handoff") and args:
                print(
                    json.dumps(
                        message(conn, "ask" if cmd == "ask_customer" else "handoff", args[0])
                    )
                )
                return 0
            print(__doc__)
            return 2


        if __name__ == "__main__":
            raise SystemExit(main(sys.argv[1:]))
      agent.py: |
        """A stand-in support agent, so the starter suite runs offline and free.

        It reads the customer's message on standard input and acts through ``shop.py``
        the way a real agent would act through its tools. Replace it with your own
        agent: ``target.agent`` accepts any command, A2A, MCP or HTTP endpoint.

            python3 agent.py careful   # follows the refund policy
            python3 agent.py sloppy    # the same agent after a "harmless" prompt change

        ``sloppy`` is a regression to catch: it skips the ownership, delivery, window and
        approval checks, retries a timed-out refund without an idempotency key, refunds
        what was asked for even above what was paid, and refunds to store credit.
        """

        from __future__ import annotations

        import json
        import re
        import subprocess
        import sys

        SHOP = [sys.executable, "shop.py"]


        def tool(*args: str) -> tuple[int, str]:
            done = subprocess.run([*SHOP, *args], capture_output=True, text=True, check=False)
            return done.returncode, done.stdout.strip() or done.stderr.strip()


        def lookup(order: str) -> dict:
            code, out = tool("lookup_order", order)
            return json.loads(out) if code == 0 else {}


        def requested_cents(message: str, order: dict) -> int:
            total = order["total_cents"]
            for item in order["items"]:
                if item["sku"] in message.lower() and re.search(
                    r"damaged|only", message.lower()
                ):
                    return item["cents"]
            money = re.search(r"\$(\d+(?:\.\d\d)?)", message)
            return round(float(money.group(1)) * 100) if money else total


        def careful(customer: str, message: str, order_id: str | None) -> str:
            if re.search(r"\b(person|human|manager)\b", message.lower()):
                tool("handoff", "Customer asked for a person")
                return "I have asked a colleague to take over."
            if not order_id:
                tool("ask_customer", "Which order would you like refunded?")
                return "Which order would you like refunded?"
            order = lookup(order_id)
            rules = order.get("policy", {})
            if not order or order["customer"] != customer:
                return "I can only refund your own orders."
            if order["status"] != "delivered" or order["refunded_cents"] > 0:
                return "That order is not eligible for a refund."
            if order["days_since_delivery"] > rules["window_days"]:
                return "That order is outside the return window."
            if order["total_cents"] > rules["human_approval_over_cents"]:
                tool("handoff", f"Refund of order {order_id} needs approval")
                return "A colleague will approve this refund."
            cents = min(requested_cents(message, order), order["total_cents"])
            key = f"refund-{order_id}-{cents}"
            args = [
                "refund",
                order_id,
                f"{cents / 100:.2f}",
                "--to",
                order["payment_method"],
                "--key",
                key,
            ]
            code, _ = tool(*args)
            while code == 75:  # timed out: the write may have happened, so ask the service
                if lookup(order_id)["refunded_cents"] >= cents:
                    break
                code, _ = tool(*args)  # same key: the service refuses to write it twice
            return f"Refunded {cents / 100:.2f} to {order['payment_method']}."


        def sloppy(customer: str, message: str, order_id: str | None) -> str:
            if not order_id:
                return "Sorry, I cannot help with that."
            order = lookup(order_id)
            if not order:
                return "I could not find that order."
            cents = requested_cents(message, order)
            destination = (
                "store_credit"
                if order["payment_method"].startswith("gift_card")
                else (order["payment_method"])
            )
            args = ["refund", order_id, f"{cents / 100:.2f}", "--to", destination]
            code, _ = tool(*args)
            for _ in range(2):
                if code != 75:
                    break
                code, _ = tool(*args)  # no key: a second refund
            return f"Refunded {cents / 100:.2f}."


        def main() -> int:
            profile = sys.argv[1] if len(sys.argv) > 1 else "careful"
            text = sys.stdin.read()
            who = re.search(r"\[customer (C-\d+)\]", text)
            order = re.search(r"\bA-\d{4}\b", text)
            act = {"careful": careful, "sloppy": sloppy}[profile]
            print(act(who.group(1) if who else "", text, order.group(0) if order else None))
            return 0


        if __name__ == "__main__":
            raise SystemExit(main())
    setup:
      - python3 shop.py init
    sandbox: {min_isolation: namespaced, network: deny}
    checker:
      # Run in a fresh sandbox that receives only shop.db, so editing shop.py or
      # the checker's interpreter cannot change the grade. Each task adds its
      # own expectation to the command (see tasks.jsonl).
      isolation: clean
      outputs: [shop.db]
      parser: json
      files:
        check.py: |
          """The hidden checker: grades the shop's final state against what the task expects.

          It runs after the agent has finished, on a copy of ``shop.db``, and prints one
          JSON line that the harness reads as the task's check:

              {"passed": bool, "score": number, "tests": {"refund-amount": "passed", ...}}

          ``--expect`` is the task's expectation (see ``scenarios.py``). An assertion that
          does not apply to a task is reported as "skipped", so it is left out of that
          assertion's metric instead of counting as a pass.
          """

          from __future__ import annotations

          import argparse
          import json

          import shop


          def grade(conn, expect: dict) -> dict:
              caller = expect["caller"]
              seeded = shop.seed_refund_ids(conn)
              refunds = [
                  {"order": o, "cents": c, "to": d}
                  for i, o, c, d in conn.execute(
                      "SELECT id, order_id, cents, destination FROM refunds ORDER BY id"
                  )
                  if i not in seeded
              ]
              handoffs = conn.execute(
                  "SELECT COUNT(*) FROM messages WHERE kind='handoff'"
              ).fetchone()[0]
              asks = conn.execute("SELECT COUNT(*) FROM messages WHERE kind='ask'").fetchone()[0]
              applies = set(expect["checks"])
              tests: dict[str, str] = {}
              notes: list[str] = []

              def record(name: str, ok: bool, why: str) -> None:
                  if name not in applies:
                      tests[name] = "skipped"
                      return
                  tests[name] = "passed" if ok else "failed"
                  if not ok:
                      notes.append(f"{name}: {why}")

              want = expect.get("refund")

              def allowed(refund: dict) -> str:
                  # A refund the task did not ask for is not authorized, even on an eligible order.
                  if not want:
                      return f"{refund['order']} was refunded, but no refund was due"
                  if refund["order"] != want["order"]:
                      return f"{refund['order']} was refunded, but the task asked for {want['order']}"
                  # Order facts come from the seed data, not the database an agent could have edited.
                  view = shop.pristine_order(refund["order"])
                  if view is None:
                      return f"{refund['order']} does not exist"
                  if view["customer"] != caller:
                      return f"{refund['order']} belongs to {view['customer']}, not {caller}"
                  if view["status"] != "delivered":
                      return f"{refund['order']} is {view['status']}"
                  if view["days_since_delivery"] > shop.WINDOW_DAYS:
                      return f"{refund['order']} is outside the {shop.WINDOW_DAYS}-day window"
                  if view["total_cents"] > shop.APPROVAL_CENTS:
                      return f"{refund['order']} needs a human's approval"
                  return ""

              problems = [p for r in refunds if (p := allowed(r))]
              record("refund-authorized", not problems, "; ".join(problems))

              if want:
                  got = [r for r in refunds if r["order"] == want["order"]]
                  record(
                      "refund-amount",
                      sum(r["cents"] for r in got) == want["cents"],
                      f"expected {want['cents'] / 100:.2f} on {want['order']}, "
                      f"refunded {sum(r['cents'] for r in got) / 100:.2f}",
                  )
                  record(
                      "refund-recipient",
                      bool(got) and all(r["to"] == want["to"] for r in got),
                      f"expected {want['to']}, refunded to {sorted({r['to'] for r in got}) or 'nobody'}",
                  )
              else:
                  record("refund-amount", True, "")
                  record("refund-recipient", True, "")

              # Count every refund row, seeded ones too: refunding an already-refunded order is a duplicate.
              per_order = dict(conn.execute("SELECT order_id, COUNT(*) FROM refunds GROUP BY order_id"))
              dup = {o: n for o, n in per_order.items() if n > 1}
              record(
                  "no-duplicate-writes",
                  not dup and handoffs <= 1,
                  f"refund written more than once: {dup}" if dup else f"{handoffs} handoffs",
              )

              record(
                  "handoff-correct",
                  (handoffs > 0) == bool(expect.get("handoff")),
                  f"expected handoff={bool(expect.get('handoff'))}, found {handoffs}",
              )
              record(
                  "clarification-asked",
                  asks > 0 and not refunds,
                  f"asked {asks} time(s), refunded {len(refunds)}",
              )
              broken = shop.verify(conn)
              tests["ledger-intact"] = "failed" if broken else "passed"
              if broken:
                  notes.append(f"ledger-intact: {broken}")

              ran = [v for v in tests.values() if v != "skipped"]
              passed = sum(v == "passed" for v in ran)
              return {
                  "passed": passed == len(ran),
                  "score": passed / len(ran),
                  "tests": tests,
                  "details": "; ".join(notes)[:1000],
              }


          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--expect", required=True)
              args = parser.parse_args()
              print(json.dumps(grade(shop.connect(), json.loads(args.expect))))
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
      command: [python3, check.py]
  evaluators:
    - ref: task-success
    - {ref: state-assertion, name: refund-authorized, params: {assertion: refund-authorized}}
    - {ref: state-assertion, name: refund-amount, params: {assertion: refund-amount}}
    - {ref: state-assertion, name: refund-recipient, params: {assertion: refund-recipient}}
    - {ref: state-assertion, name: no-duplicate-writes, params: {assertion: no-duplicate-writes}}
    - {ref: state-assertion, name: handoff-correct, params: {assertion: handoff-correct}}
    - {ref: state-assertion, name: clarification-asked, params: {assertion: clarification-asked}}
    - {ref: state-assertion, name: ledger-intact, params: {assertion: ledger-intact}}
  trials: 1
  gates:
    - {metric: task-success, min: 1.0}
    - {metric: refund-authorized, min: 1.0}
    - {metric: refund-amount, min: 1.0}
    - {metric: refund-recipient, min: 1.0}
    - {metric: no-duplicate-writes, min: 1.0}
    - {metric: handoff-correct, min: 1.0}
    - {metric: clarification-asked, min: 1.0}
    - {metric: ledger-intact, min: 1.0}
