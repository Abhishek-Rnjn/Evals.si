apiVersion: evals.si/v1alpha1
kind: EvalRun
metadata:
  name: onboarding-support
  labels: {evals.si/project: onboarding}
spec:
  target:
    connector: openai-compatible
    model: tinylm-support
    base_url: http://onboarding-model.onboarding.svc:8765/v1
    api_key_env: none
    stream: true
  dataset:
    inline:
      records:
        - id: refund-paid
          input: {text: "Customer asks: please refund order 42."}
          reference:
            json:
              tool_calls:
                - {name: lookup_order, arguments: {id: 42}}
                - {name: refund, arguments: {id: 42}}
  harness:
    builtin:
      max_steps: 6
      tools:
        sandbox: false
        mocks:
          - name: lookup_order
            description: Look up an order by id.
            input_schema: {type: object, properties: {id: {type: integer}}, required: [id]}
            response: "order 42: status paid, total $30.00"
          - name: refund
            description: Refund an order in full.
            input_schema: {type: object, properties: {id: {type: integer}}, required: [id]}
            response: "ok: refund issued"
  evaluators:
    - ref: tool-call-accuracy
    - ref: tool-errors
    - ref: run-completed
  gates:
    - {metric: tool-call-accuracy.recall, min: 1.0}
    - {metric: tool-call-accuracy.precision, min: 1.0}
    - {metric: tool-errors, max: 0.0}
    - {metric: run-completed, min: 1.0}
