[project]
name = "acme-evals"
version = "0.1.0"
description = "Example custom Evals.si evaluator pack"
requires-python = ">=3.11"
dependencies = ["evalsi"]

# Registers the pack so `evalsi eval --evaluators acme/valid-citations` finds it.
[project.entry-points."evalsi.packs"]
acme = "valid_citations:PACK"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["valid_citations.py"]
