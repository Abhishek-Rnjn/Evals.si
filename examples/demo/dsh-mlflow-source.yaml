apiVersion: evalsi.dev/v1alpha1
kind: TraceSource
metadata:
  name: dsh-mlflow
  labels: {evalsi.dev/project: demo}
spec:
  connector: mlflow
  endpoint: http://evalsi-demo-mlflow:5000
  locations: [evalsi-demo-dsh]
  backfill: {since: 24h}
  poll: {interval: 15s}
  policies: [dsh-online]
  writeBack: {enabled: true}