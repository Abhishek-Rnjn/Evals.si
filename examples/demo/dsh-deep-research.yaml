# DeepSeek Harness (dsh) asked research questions over a handful of documents
# placed in each task's workdir. It reads them with its own tools and writes a
# report; a judge grades the report against a rubric, and citation accuracy
# checks its [n] against the documents.
#
# Needs a judge (see deepagents-deep-research.yaml); CI does not run this suite.
apiVersion: evals.si/v1alpha1
kind: EvalRun
metadata:
  name: dsh-deep-research
  labels: {evals.si/project: demo}
spec:
  target:
    agent:
      cli:
        command: [dsh-demo-configure, dsh, --profile, headless, --json, "{instruction}"]
        output_format: dsh-json
        env_from: {DEMO_API_KEY: DEMO_API_KEY}
        allow_hosts: ["evalsi-demo-model:8000"]
        timeout: 10m
  dataset:
    path: fixtures/deep-research-docs.jsonl
  environment:
    image: ghcr.io/abhishek-rnjn/evalsi-demo-dsh:0.1.0
    env:
      DEMO_BASE_URL: http://evalsi-demo-model:8000/v1
      DEMO_MODEL: mock
      NODE_OPTIONS: --disable-wasm-trap-handler
      HOME: /tmp/agent-home
    sandbox: {min_isolation: namespaced, network: deny, memory_mb: 4096}
  evaluators:
    - ref: llm-judge
      name: report-quality
      params:
        rubric: >-
          The report answers the question using only the provided documents,
          covers the key points of the reference answer, is organized, and
          cites its sources as [n] with a list of sources.
    - ref: citation-accuracy
    - ref: tool-errors
    - ref: loop-detection
    - ref: step-budget
      params: {max_steps: 12}
    - ref: agent-efficiency
  trials: 2
  gates:
    - {metric: report-quality, min: 0.6}
    - {metric: citation-accuracy, min: 0.9}
