# Istio ambient with a waypoint, mesh-wide STRICT mTLS (as on the verification
# cluster). The waypoint cannot carry NATS (the server speaks first) or the
# pool's calls to sandbox pods, and the API server is outside the mesh, so:
# opt those Services and pods out of the waypoint, and let the admission
# webhooks take plaintext on their port.
#
#   helm install evalsi deploy/helm/evalsi -n evalsi -f examples/demo/overlays/evalsi-demo.yaml -f examples/demo/overlays/istio-ambient.yaml
#   helm install evalsi-demo examples/demo -n evalsi -f examples/demo/overlays/istio-ambient.yaml

# --- the demo chart: every Service ---
serviceLabels:
  istio.io/use-waypoint: none

# --- the evalsi chart ---
nats:
  serviceLabels: {istio.io/use-waypoint: none}
devPostgres:
  serviceLabels: {istio.io/use-waypoint: none}
devMinio:
  serviceLabels: {istio.io/use-waypoint: none}
operator:
  istio:
    peerAuthentication: true
sandbox:
  pool:
    pod:
      labels: {istio.io/use-waypoint: none}
      # Calico and ambient: the policy may not be enforced; the sandbox probe says.
      networkPolicyEnforced: false
