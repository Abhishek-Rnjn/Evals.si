# A sandbox pool on the pod rung, for an install with no sandboxes of its own
# (add it after evalsi-demo.yaml):
#
#   helm install evalsi deploy/helm/evalsi -n evalsi \
#     -f examples/demo/overlays/evalsi-demo.yaml -f examples/demo/overlays/pod-pool.yaml -f examples/demo/overlays/<shape>.yaml
#
# Agent runs go on the pod rung: a hardened pod per sandbox (they refuse
# Landlock by design), which a namespace-only install can run.
sandbox:
  pool:
    enabled: true
    ladder: [pod]
