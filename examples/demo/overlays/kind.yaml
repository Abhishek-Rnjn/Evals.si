# kind: kindnet does not enforce NetworkPolicy, and a single node is enough.
# The default storage class and no taints, so nothing else to set; local
# images built with docker are loaded with `kind load docker-image` and are
# found by their ghcr.io names.
#
#   helm install evalsi deploy/helm/evalsi -n evalsi -f examples/demo/overlays/evalsi-demo.yaml -f examples/demo/overlays/kind.yaml
#   helm install evalsi-demo examples/demo -n evalsi -f examples/demo/overlays/kind.yaml
server:
  replicas: 1
sandbox:
  pool:
    pod:
      networkPolicyEnforced: false     # kindnet ignores NetworkPolicy
mlflow:
  persistence:
    enabled: false
