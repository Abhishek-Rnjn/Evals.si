# Values for the evalsi chart that the demos need, whatever the cluster:
#
#   helm install evalsi deploy/helm/evalsi -n evalsi \
#     -f examples/demo/overlays/evalsi-demo.yaml -f examples/demo/overlays/<shape>.yaml
#
# S3 for the datasets (a Kubernetes install cannot read files on the server's
# disk), a project for the demos and the grant that lets its runs name the
# model's key and MLflow as a sink. A cluster without a sandbox pool also needs pod-pool.yaml.
devPostgres:
  enabled: true
devMinio:
  enabled: true
storage:
  s3:
    bucket: evalsi
    prefix: datasets

# The first state, made by the bootstrap Job. DEMO_API_KEY is the variable the
# run specs name; no hosts, because a key copied into a sandbox (env_from) can
# only be an unrestricted grant. The key itself lives in a Secret
# (evalsi-demo-model-key), which the workers read: it is never in a pod spec
# or a run spec.
bootstrap:
  enabled: true
  projects:
    - {name: demo, description: the reference demos}
  credentialGrants:
    - {env: DEMO_API_KEY, projects: [demo]}
  # M2: what an agent harness install starts with. The deployed workflows send
  # traces with the ingest key (deepagents.otlp in the demo chart), and the
  # default policy scores every trace that names its workflow, so a new
  # workflow is scored from its first execution with nothing applied for it.
  # The reader key is what the harness's UI reads the scores with.
  apiKeys:
    - {name: demo-ingest, roles: {demo: [ingest]}, secret: {name: evalsi-demo-ingest-key}}
    - {name: demo-reader, roles: {demo: [viewer]}, secret: {name: evalsi-demo-reader-key}}
  policies:
    - name: studio-default
      project: demo
      selector: '"workflow" in labels && labels["stage"] == "production"'
      stages:
        - evaluators: [{ref: tool-errors}, {ref: loop-detection}, {ref: builtin/latency}]
      window: 3600s
workers:
  env:
    - name: DEMO_API_KEY
      valueFrom: {secretKeyRef: {name: evalsi-demo-model-key, key: key}}

# R6: the Deep Agents service's traces are read back from that MLflow
# (deepagents-mlflow-source.yaml), which is plain HTTP inside the cluster, so
# the server must be told it may reach it.
sources:
  allowHosts: [evalsi-demo-mlflow]

# Run scores and run results go to the MLflow the demo chart runs.
server:
  config:
    sinks:
      - mlflow: {tracking_uri: "http://evalsi-demo-mlflow:5000", experiment: evalsi-demo}
