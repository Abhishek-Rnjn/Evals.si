# DeepSeek Harness (dsh) fixing small repositories: 11 SWE-bench-style tasks
# graded by hidden tests. dsh runs headless inside each task's sandbox and its
# `--json` run events become the trajectory.
#
# The same file runs embedded, on a server, and (kubectl apply) on Kubernetes:
# the model and the agent's tools are reached by name, so nothing here is
# specific to one mode. See README.md for the model service (a mock by default)
# and for the worker variable DEMO_API_KEY that carries the model's key.
apiVersion: evals.si/v1alpha1
kind: EvalRun
metadata:
  name: dsh-small-repo-fixes
  labels: {evals.si/project: demo}
spec:
  target:
    agent:
      cli:
        # dsh-demo-configure points dsh at DEMO_BASE_URL and DEMO_MODEL, then runs it.
        command: [dsh-demo-configure, dsh, --profile, headless, --json, "{instruction}"]
        output_format: dsh-json
        env_from: {DEMO_API_KEY: DEMO_API_KEY}
        allow_hosts: ["evalsi-demo-model:8000"]
        timeout: 10m
  dataset:
    path: fixtures/small-repo-fixes.jsonl
  environment:
    # The image carries dsh. Omit it to use the host's own tools (a laptop
    # with dsh installed under /usr).
    image: ghcr.io/abhishek-rnjn/evalsi-demo-dsh:0.1.0
    env:
      DEMO_BASE_URL: http://evalsi-demo-model:8000/v1
      DEMO_MODEL: mock
      NODE_OPTIONS: --disable-wasm-trap-handler
      PYTHONDONTWRITEBYTECODE: "1"
      HOME: /tmp/agent-home      # dsh keeps its state under HOME, which the sandbox does not set
    # Node reserves a large address range, which the default memory limit makes
    # it abort on: dsh needs at least 4 GiB.
    sandbox: {min_isolation: namespaced, network: deny, memory_mb: 4096}
  evaluators:
    - ref: task-success
    - ref: policy-violations
    - ref: tool-errors
    - ref: loop-detection
    - ref: agent-efficiency
  trials: 3
  gates:
    - {metric: task-success.pass^3, min: 0.8}
