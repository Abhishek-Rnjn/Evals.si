---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-evals-si
  failurePolicy: Fail
  name: mutate.evals.si
  rules:
  - apiGroups:
    - evals.si
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - evalruns
    - onlineevalpolicies
    - evaluators
    - sandboxclasses
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-evals-si
  failurePolicy: Fail
  name: validate.evals.si
  rules:
  - apiGroups:
    - evals.si
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - evalruns
    - onlineevalpolicies
  sideEffects: None
