---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-evalsi-dev
  failurePolicy: Fail
  name: mutate.evalsi.dev
  rules:
  - apiGroups:
    - evalsi.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - evalruns
    - onlineevalpolicies
    - tracesources
    - evaluators
    - sandboxclasses
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-evalsi-dev
  failurePolicy: Fail
  name: validate.evalsi.dev
  rules:
  - apiGroups:
    - evalsi.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - evalruns
    - onlineevalpolicies
    - tracesources
  sideEffects: None
