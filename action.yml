name: Evals.si gate
description: Run evaluation gates, publish a metrics summary, and optionally compare a baseline.
branding:
  icon: check-circle
  color: purple
inputs:
  spec:
    description: EvalRun YAML path, relative to working-directory.
    required: true
  working-directory:
    description: Project directory, relative to the checkout (or absolute).
    default: .
  version:
    description: Matching published evalsi and evalsi-harness version.
    default: 0.3.1
  python-version:
    description: Python runtime for the evaluation.
    default: '3.12'
  install:
    description: Install published packages; set false only with an existing compatible installation.
    default: 'true'
  baseline:
    description: Optional results JSON path relative to working-directory; comparison is advisory.
    default: ''
  server:
    description: Optional evalsid URL for enforced release decisions; requires a compatible SDK and explicit policy/baseline pins.
    default: ''
  release-policy:
    description: Reviewed release policy JSON/YAML path, relative to working-directory.
    default: ''
  release-policy-sha256:
    description: Independently reviewed policy pin; never computed from a candidate-controlled policy automatically.
    default: ''
  baseline-run:
    description: Explicit reviewed baseline server run ID.
    default: ''
  baseline-sha256:
    description: Reviewed baseline run evidence SHA-256.
    default: ''
  baseline-commit:
    description: Declared commit recorded on the baseline run.
    default: ''
  release-id:
    description: New immutable decision ID; defaults to ci-GITHUB_RUN_ID-GITHUB_RUN_ATTEMPT.
    default: ''
  artifact-name:
    description: Opt in to uploading raw results and process logs (may contain private data).
    default: ''
outputs:
  exit-code:
    description: 0 passed, 3 blocked or failed gates, 1 insufficient evidence or execution/configuration error.
    value: ${{ steps.gate.outputs.exit-code }}
  results:
    description: Absolute path to run results or a portable release report, if produced.
    value: ${{ steps.gate.outputs.results }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install matching packages
      if: inputs.install == 'true'
      shell: bash
      env:
        EVALSI_ACTION_VERSION: ${{ inputs.version }}
      run: |
        python - <<'PY'
        import os, re, subprocess, sys
        version = os.environ['EVALSI_ACTION_VERSION']
        if not re.fullmatch(r'[0-9][A-Za-z0-9.!+_-]*', version):
            sys.exit('version must be a package version, not a URL or requirement')
        subprocess.run([sys.executable, '-m', 'pip', 'install',
                        'evalsi[server]==' + version, 'evalsi-harness==' + version], check=True)
        PY
    - name: Run gate and write summary
      id: gate
      shell: bash
      env:
        EVALSI_ACTION_ROOT: ${{ github.action_path }}
        EVALSI_ACTION_SPEC: ${{ inputs.spec }}
        EVALSI_ACTION_DIRECTORY: ${{ inputs.working-directory }}
        EVALSI_ACTION_BASELINE: ${{ inputs.baseline }}
        EVALSI_ACTION_SERVER: ${{ inputs.server }}
        EVALSI_ACTION_RELEASE_POLICY: ${{ inputs.release-policy }}
        EVALSI_ACTION_RELEASE_POLICY_SHA256: ${{ inputs.release-policy-sha256 }}
        EVALSI_ACTION_BASELINE_RUN: ${{ inputs.baseline-run }}
        EVALSI_ACTION_BASELINE_SHA256: ${{ inputs.baseline-sha256 }}
        EVALSI_ACTION_BASELINE_COMMIT: ${{ inputs.baseline-commit }}
        EVALSI_ACTION_RELEASE_ID: ${{ inputs.release-id }}
      run: python "$EVALSI_ACTION_ROOT/.github/actions/evalsi/run.py"
    - name: Upload private run data only when requested
      if: always() && inputs.artifact-name != '' && steps.gate.outputs.artifact-directory != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.gate.outputs.artifact-directory }}
        retention-days: 7
        if-no-files-found: error
    - name: Propagate gate outcome
      if: always()
      shell: bash
      env:
        EVALSI_ACTION_EXIT_CODE: ${{ steps.gate.outputs.exit-code }}
      run: |
        python - <<'PY'
        import os, sys
        code = os.environ.get('EVALSI_ACTION_EXIT_CODE', '')
        sys.exit(int(code) if code in ('0', '3') else 1)
        PY
