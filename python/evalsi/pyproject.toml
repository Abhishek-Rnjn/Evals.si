[project]
name = "evalsi"
dynamic = ["version"]
description = "Evaluate AI before you ship, while it runs and as you train it: agents, RAG pipelines, LLMs and models."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Abhishek Ranjan" }]
keywords = ["agents", "agent-evaluation", "ai-agents", "rag", "rag-evaluation", "evals", "evaluation", "llm", "llm-as-a-judge", "fine-tuning", "rl", "reward", "sandbox", "ci", "mlops", "opentelemetry", "kubernetes"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "protobuf>=7.35",
    "pyyaml>=6.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.14.0"]
hf = ["datasets>=2.18"]
jsonschema = ["jsonschema>=4.0"]
# Symbolic answer equivalence in the rl pack's math-equiv.
math = ["sympy>=1.13"]
# Cross-run analytics (evalsi analyze).
analytics = ["duckdb>=1.1"]
# The worker that serves evaluators to the evalsid server over gRPC.
server = ["grpcio>=1.84", "grpcio-health-checking>=1.84"]
# The streaming client (Client.evaluate_stream).
grpc = ["grpcio>=1.84"]

[project.scripts]
evalsi = "evalsi.cli:main"

# Evaluator packs are discovered through this entry-point group, including the
# built-in ones, so third-party packs plug in exactly like ours.
[project.entry-points."evalsi.packs"]
core = "evalsi.packs.core:PACK"
judge = "evalsi.packs.judge:PACK"
text = "evalsi.packs.text:PACK"
rag = "evalsi.packs.rag:PACK"
safety = "evalsi.packs.safety:PACK"
agent = "evalsi.packs.agent:PACK"
code = "evalsi.packs.code:PACK"
rl = "evalsi.packs.rl:PACK"
finetune = "evalsi.packs.finetune:PACK"
ml-classic = "evalsi.packs.ml_classic:PACK"
ml-monitoring = "evalsi.packs.ml_monitoring:PACK"

[project.entry-points."evalsi.importers"]
snapshot = "evalsi.dataset_snapshots:import_snapshot"

[project.urls]
Homepage = "https://evalsi.dev/"
Documentation = "https://evalsi.dev/"
Repository = "https://github.com/Abhishek-Rnjn/Evals.si"
Issues = "https://github.com/Abhishek-Rnjn/Evals.si/issues"
Changelog = "https://github.com/Abhishek-Rnjn/Evals.si/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalsi"]

[tool.hatch.version]
path = "src/evalsi/_version.py"
