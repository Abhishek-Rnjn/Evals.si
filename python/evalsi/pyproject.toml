[project]
name = "evalsi"
dynamic = ["version"]
description = "One entrypoint for evaluating ML models, LLMs and agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "protobuf>=7.35",
    "pyyaml>=6.0",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
hf = ["datasets>=2.18"]
jsonschema = ["jsonschema>=4.0"]
# The worker that serves evaluators to the evalsid server over gRPC.
server = ["grpcio>=1.84", "grpcio-health-checking>=1.84"]

[project.scripts]
evalsi = "evalsi.cli:main"

# Evaluator packs are discovered through this entry-point group, including the
# built-in ones, so third-party packs plug in exactly like ours.
[project.entry-points."evalsi.packs"]
core = "evalsi.packs.core:PACK"
judge = "evalsi.packs.judge:PACK"
text = "evalsi.packs.text:PACK"
rag = "evalsi.packs.rag:PACK"
safety = "evalsi.packs.safety:PACK"
agent = "evalsi.packs.agent:PACK"

[project.urls]
Repository = "https://github.com/abhishek-rnjn/evals.si"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalsi"]

[tool.hatch.version]
path = "src/evalsi/_version.py"
