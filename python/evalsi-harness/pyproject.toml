[project]
name = "evalsi-harness"
dynamic = ["version"]
description = "The agent harness for Evals.si: run and grade AI agents on sandboxed tasks, with a tool loop, MCP tools, a user simulator, record and replay."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Abhishek Ranjan" }]
keywords = ["agents", "agent-evaluation", "ai-agents", "evaluation", "agent-harness", "sandbox", "mcp", "benchmarks", "ci", "rl-environments"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    # The harness speaks evalsi's protocol: the same release only. The
    # release workflow sets this with the version.
    "evalsi[server]==0.3.0.dev0",
    "httpx>=0.27",
]

[project.entry-points."evalsi.importers"]
harbor = "evalsi_harness.benchmarks.harbor:load_harbor"
terminal-bench = "evalsi_harness.benchmarks.harbor:load_terminal_bench"
lab = "evalsi_harness.benchmarks.lab:load_lab"
jobbench = "evalsi_harness.benchmarks.jobbench:load_jobbench"

[project.urls]
Homepage = "https://evalsi.dev/"
Documentation = "https://evalsi.dev/"
Repository = "https://github.com/Abhishek-Rnjn/Evals.si"
Issues = "https://github.com/Abhishek-Rnjn/Evals.si/issues"
Changelog = "https://github.com/Abhishek-Rnjn/Evals.si/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalsi_harness"]

[tool.hatch.version]
path = "src/evalsi_harness/_version.py"
