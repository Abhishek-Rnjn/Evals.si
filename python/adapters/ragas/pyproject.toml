[project]
name = "evalsi-adapter-ragas"
version = "0.1.0"
description = "RAGAS metrics as Evals.si evaluators, judged by the run's judge."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "evalsi",
    # Pinned: the adapter is contract-tested against this exact version.
    "ragas==0.4.3",
    # ragas 0.4.3 imports langchain_community.chat_models.vertexai, removed in 0.4.
    "langchain-community<0.4",
]

[project.entry-points."evalsi.packs"]
ragas = "evalsi_ragas:PACK"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3"]

[tool.uv.sources]
evalsi = { path = "../../evalsi", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalsi_ragas"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["ragas.*"]
ignore_missing_imports = true
