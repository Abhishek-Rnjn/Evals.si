# uv workspace for the Python half of Evals.si (SDK, packs, adapters, harness).
[tool.uv.workspace]
members = ["evalsi", "evalsi-harness"]

[tool.uv.sources]
evalsi = { workspace = true }
evalsi-harness = { workspace = true }

[dependency-groups]
dev = [
    "evalsi[anthropic,jsonschema,math,server]",
    "evalsi-harness",
    "grpcio-tools==1.84.0",
    "mypy-protobuf==5.0.0",
    "types-grpcio",
    "types-grpcio-health-checking",
    "types-protobuf",
    "types-pyyaml",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "evalsi/src/evalsi/v1alpha1",
    "evalsi/src/evalsi/plugin",
    "evalsi/src/evalsi/sandbox/v1alpha1",
    "evalsi/src/evalsi/harness/v1alpha1",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "PT"]
ignore = [
    "PLR0911", # too many return statements: small dispatch functions read better flat
    "PLR0912", # too many branches
    "PLR0913", # too many arguments: public APIs take keyword options
    "PLR2004", # magic values in comparisons
    "PLC0415", # lazy imports: optional dependencies are imported only when used
]

[tool.ruff.lint.isort]
known-first-party = ["evalsi", "evalsi_harness", "evalsi_*", "conftest"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["evalsi/src", "evalsi/tests", "evalsi-harness/src", "evalsi-harness/tests"]

[[tool.mypy.overrides]]
module = ["datasets", "datasets.*", "jsonschema", "jsonschema.*", "sympy", "sympy.*", "math_verify", "torch", "transformers", "transformers.*", "trl", "trl.*"]
ignore_missing_imports = true

# Generated code is typed through its .pyi stubs; do not check the .py bodies.
[[tool.mypy.overrides]]
module = [
    "evalsi.v1alpha1.*",
    "evalsi.plugin.v1alpha1.*",
    "evalsi.sandbox.v1alpha1.*",
    "evalsi.harness.v1alpha1.*",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["evalsi/tests", "evalsi-harness/tests"]
